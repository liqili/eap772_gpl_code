[rootfs]
# Volume mode (other option is static)
mode=ubi
# Source image
image=../../ipq53xx_eap7xx_common-squashfs-root.img
# Volume ID in UBI image
vol_id=0
# Allow for dynamic resize
vol_type=static
# Volume name
vol_name=ubi_rootfs

[kernel]
# Volume mode (other option is static)
mode=ubi
# Source image
image=../../ipq53xx_eap7xx_common-fit-uImage.itb
# Volume ID in UBI image
vol_id=1
# Allow for dynamic resize
vol_type=static
# Volume name
vol_name=kernel

