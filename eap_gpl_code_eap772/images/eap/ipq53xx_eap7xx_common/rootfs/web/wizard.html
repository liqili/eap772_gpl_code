	function synPcClock()
	{
		var date = new Date();
		var year =date.getFullYear();
		var month=date.getMonth()+1;
		month = month < 10 ? "0"+month : month;
		var day=date.getDate();
		day = day < 10 ? "0"+day : day;
		var hour=date.getHours()<10?"0"+date.getHours():date.getHours();
		var minute=date.getMinutes()<10?"0"+date.getMinutes():date.getMinutes();
		var second=date.getSeconds()<10?"0"+date.getSeconds():date.getSeconds();

		var d1 = (new Date(2019, 1, 1)).getTimezoneOffset();
		var d2 = (new Date(2019, 6, 1)).getTimezoneOffset();
		var localUtc;
		parseInt(d1)>parseInt(d2)?localUtc=d1/6:localUtc=d2/6;
		// var localUtc = d1.getTimezoneOffset()/6;
		for(var e in timeZoneItem){
			if( timeZoneItem[e].index == localUtc){
				timeZoneStr = timeZoneItem[e].value;
				break;
			}else{
				timeZoneStr = '720';
			}
		}

		var dateStr = month+"/"+day+"/"+year;
		var timeStr = hour+":"+minute+":"+second;

		return [dateStr, timeStr, timeZoneStr];
	}

	function WPAPSK_key_invalid(pwd)
	{
	    var c;
	    var zeronum = 0;
	    var is_Hex = 0;
	    var ch = "0123456789ABCDEFabcdefGHIJKLMNOPQRSTUVWXYZghijklmnopqrstuvwxyz`~!@#$^&*()-=_+[]{};:\'\"\\|/?.,<>/% ";
	    var hexch = ch.substring(0, 22);
	    for (var i = 0; i < pwd.length; i++)
	    {
	    	c = pwd.charAt(i);
	    	if (hexch.indexOf(c) == -1)
	    	{
	    		break;
	    	}
	    }
	    if(i == pwd.length)
	    {
	    	is_Hex = 1;
	    }
	    if (is_Hex == 1) 
	        ch = ch.substring(0, 22);
	    for (var i = 0; i < pwd.length; i++) {
	        c = pwd.charAt(i);
	        if (ch.indexOf(c) == -1) 
	            return false;
	    }
	    if ((pwd.length < 8 || pwd.length > 63) && (is_Hex == 1) )
	            return false;
	    if ((pwd.length < 8 || pwd.length > 63) && (is_Hex == 0) )
	            return false;
	    return true;
	}
