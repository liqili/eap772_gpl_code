/**********END*app定义END*********/
$.su.app = {
    runningModule: {
        name: "",
        busy: false,
        addUnloadHandler: function(fn){
            if ($.isFunction(fn)){
                this.unloadHandlers.push(fn);
            }
        },
        clearUnloadHandler: function(){
            this.unloadHandlers = [];
        },
        unload: function(oldN, newN){
            this.name = newN;
            var handlers = this.unloadHandlers;
            for (var index in handlers){
                var fn = handlers[index];
                if ($.isFunction(fn)){
                    fn();
                }
            };
            this.clearUnloadHandler();
        },
        unloadHandlers: []
    },
    menuGoTo: function(name, url, isAdvanced){
    	if($.su.app.runningModule.busy === true){
    		return;
    	}
    	$.su.app.runningModule.busy = true;
        var contentContainer = $("div#top-content");		
        //旧模块卸载
        $.su.Manager.removeLocal();
        //var runningModule = $.su.app.runningModule;
        //$.su.app.runningModule.trigger("ev_beforeunload", [$.su.app.runningModule[0].name, name]);
        //console.log("menuGoTo", runningModule)
        var runningModule = $.su.app.runningModule;
            runningModule.unload(runningModule.name, name);

        contentContainer.load(url, function(response,status,xhr){
            //$.su.app.runningModule.trigger("ev_unload", [name]);
            $.su.layout.doLayout();
            $.su.app.runningModule.busy = false;
        });
    }
};

	//cls: "login-text",
	allowBlank: false
});

$("input#new-password").password({
	fieldLabel: $.su.CHAR.INDEX.NEW_PASSWORD,
	hint: $.su.CHAR.INDEX.NEW_PASSWORD,
	_maxLength: 64,
	vtype: "ascii_visible",
	allowBlank: false,
	validator:function(val){
		var cfm_pwd = $("input#confirm-password").password("getValue");
		if (!$.su.func.checkPswLevel(val)) {
			return $.su.CHAR.VTYPETEXT.PSW_LEVEL_ERROR
		}

		if(val == cfm_pwd)
		{
			$("#password-status").status("setSuccess");
			return true;
		}
		else
		{
			if (cfm_pwd.length != 0) {
				$("#password-status").status("setFailed");
				return true;
			} else {
				return true;
			}
		}
	}
});


$("#password-status").status({
	cls:"inline"
});

$("input#confirm-password").password({
	fieldLabel: $.su.CHAR.INDEX.CONF_PASSWORD,
	hint: $.su.CHAR.INDEX.CONF_PASSWORD,
	showLevel:false,
	allowBlank:false,
	_minLength: 0,
	_maxLength: 64,
	vtype:"ascii_visible",
	cls:"inline",
	validator:function(val){
		var new_pwd = $("input#new-password").password("getValue");
		if(val == new_pwd)
		{
			$("#password-status").status("setSuccess");
			return true;
		}
		else
		{
			$("#password-status").status("setFailed");
			return true;
		}
	}
}).on("ev_change", function(e, value, key, keyCode){
	if (key == "Enter" || keyCode == 13){
	    $("button#confirm-btn").focus();
	    return doChpwd();
	};
});


var forceChpwdProxy = new $.su.Proxy({
	url: "./data/forceChpwd.json"
});

var chPwdForm = $("div#reset-user-form").form({
	proxy: forceChpwdProxy,
	fields: [
		{name: "new-username", mapping: "new-username"},
		{name: "new-password", mapping: "new-password"}
	],
	autoLoad:false,
	submitBtn: null
});

var doChpwd = function(){
	if( !$("input#new-username").textbox('validate') 
		|| !$("input#new-password").password('validate')
		|| !$("input#confirm-password").password('validate') ){
		return false;
	}

	if (0 == $("input#new-username").textbox("getValue").length)
	{
		$("input#new-username").textbox("setError", $.su.CHAR.INDEX.ERR_USERNAME_EMPTY);
		return false;
	}

	if ($("input#new-password").textbox("getValue").toUpperCase() == "ADMIN"){
		$("input#new-password").textbox("setError", $.su.CHAR.INDEX.PWD_NOT_ALLOWED);
		return false;
	}
	
	if (0 == $("input#new-password").textbox("getValue").length)
	{
		$("input#new-password").textbox("setError", $.su.CHAR.INDEX.ERR_PWD_EMPTY);
		return false;
	}

	if (0 == $("input#confirm-password").textbox("getValue").length)
	{
		$("input#confirm-password").textbox("setError", $.su.CHAR.INDEX.ERR_PWD_CONFIRM_EMPTY);
		return false;
	}

	if ($("input#new-password").textbox("getValue") != $("input#confirm-password").textbox("getValue"))
	{
		$("input#confirm-password").textbox("setError", $.su.CHAR.INDEX.ERR_PWD_CONFIRM_WRONG);
		return false;
	}
		
	if(!$.su.vtype.types.ascii_visible.regex.test($("input#new-password").textbox("getValue")))
	{
		$("input#new-password").textbox("setError", $.su.vtype.types.ascii_visible.vtypeText);
		return false;
	}

	if(!$.su.vtype.types.ascii_visible.regex.test($("input#confirm-password").textbox("getValue")))
	{
		$("input#confirm-password").textbox("setError", $.su.vtype.types.ascii_visible.vtypeText);
		return false;
	}
	
	$("input#new-password").textbox("setValue", md5($("input#new-password").textbox("getValue")).toUpperCase());
	$("input#confirm-password").textbox("setValue", md5($("input#confirm-password").textbox("getValue")).toUpperCase());
	chPwdForm.form('submit',null, function(){resetUserMsg.msg("close");});
	
	return true;
};

$("button#confirm-btn").button({
        text: $.su.CHAR.INDEX.CONFIRM,
        handler: function(e){
			doChpwd();
        },
        cls: "submit inline-block"
