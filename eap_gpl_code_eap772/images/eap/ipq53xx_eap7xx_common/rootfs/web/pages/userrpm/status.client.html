	function num2Str(num)
	{
		var str = "";
		if(num <= 1000)
		{
			str += num;
		}
		else
		{
			str += Math.floor(num/1000) + "k";
		}

		return str;
	}

					return num2Str(val);
				}
			},
			{
				text: $.su.CHAR.STATUS_CLIENT.ACTION,
				width: 100,
				dataIndex: 'key',
				renderer: function(val){
					var key = val;
					var inHTML = "";
					var  inHTML = 		"<a href=\"javascript:void(0);\" data-key=\""+key+"\" class=\"grid-content-btn grid-content-btn-delete btn-delete\">";
						inHTML +=			"<span class=\"icon\" title=\""+$.su.CHAR.STATUS_CLIENT.UNBLOCK+"\"> </span>";
						inHTML += 			"<span class=\"text\">"+$.su.CHAR.STATUS_CLIENT.UNBLOCK+"</span>";
						inHTML += 		"</a>";
					return inHTML;
				}
			}
		],
		operation: [
			"refresh"
		]
	}).delegate("a.grid-content-btn.grid-content-btn-delete", "click", function(e){
		e.preventDefault();
		e.stopPropagation();		

		var store =$(blockClientGrid).grid("getStore");
		var key = $(this).attr("data-key");
		var data = store.getData(key);
		var MAC = data.MAC;
		var hostname = data.hostname;
		var up = data.Up;
		var down = data.Down;
		
		store.load({
			operation: 'remove',
			hostname: hostname,
			MAC: MAC,
			up: up,
			down: down
		});
	});
	
/////////////////////////////////////////////////////////////////////////////////////////////
	$("#rate_limit_msg").msg({
		type:"panel",
		cls:"rate-limit-msg"
	});

	// $('#rate_limit_tip_icon').attr('title', $.su.CHAR.STATUS_CLIENT.RATE_LIMIT_TIP);
	// $('#rate_limit_tip').html($.su.CHAR.STATUS_CLIENT.RATE_LIMIT_TIP);

	$('#rate_limit_form').form({
		proxy: {
			url: "./data/status.client.ratelimit.json",
			type: "POST",
			timeout: 60000
		},
		fields: [
			{name: "limit", mapping: "limit"},
			{name: "limit_download", mapping: "limit_download"},
			{name: "limit_download_unit", mapping: "limit_download_unit"},
			{name: "limit_upload", mapping: "limit_upload"},
			{name: "limit_upload_unit", mapping: "limit_upload_unit"}
		],
		autoLoad:false,
		submitBtn: null
	});

	var limitNum = $("input#rate_limit_download").textbox({
		fieldLabel:$.su.CHAR.WIRELESS.RATE_LIMIT_DOWNLOAD,
		cls: 'inline-block',
		inputCls: 'm',
		allowBlank: false,
		vtype: 'number'
	});

	var limitDown = $("input#rate_limit_download_unit").combobox({
		fieldLabel: null,
		cls: 'inline-block',
		inputCls: 'm',
		allowBlank: false,
	    items: [
				{value: 0, name: $.su.CHAR.WIRELESS.KBPS, selected: "selected"},
				{value: 1, name: $.su.CHAR.WIRELESS.MBPS}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if(newValue[0] == 0){
			$('span#text_rate_limit_download_unit').html($.su.CHAR.WIRELESS.KBPS_UNIT);
		}else{
			$('span#text_rate_limit_download_unit').html($.su.CHAR.WIRELESS.MBPS_UNIT);
		}
	});

	$("input#rate_limit_upload").textbox({
		fieldLabel:$.su.CHAR.WIRELESS.RATE_LIMIT_UPLOAD,
		cls: 'inline-block',
		inputCls: 'm',
		allowBlank: false,
		vtype: 'number'
	});

	$("input#rate_limit_mac").textbox({
		fieldLabel:$.su.CHAR.WIRELESS.RATE_LIMIT_UPLOAD,
		cls: 'hidden'
	});

	var limitUp = $("input#rate_limit_upload_unit").combobox({
		fieldLabel: null,
		cls: 'inline-block',
		inputCls: 'm',
		allowBlank: false,
	    items: [
			{value: 0, name: $.su.CHAR.WIRELESS.KBPS, selected: "selected"},
			{value: 1, name: $.su.CHAR.WIRELESS.MBPS}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if(newValue[0] == 0){
			$('span#text_rate_limit_upload_unit').html($.su.CHAR.WIRELESS.KBPS_UNIT);
		}else{
			$('span#text_rate_limit_upload_unit').html($.su.CHAR.WIRELESS.MBPS_UNIT);
		}
	});

	$("input#rate_limit").checkbox({
		fieldLabel:$.su.CHAR.WIRELESS.RATE_LIMIT,
		cls: 'inline-block',
		items: [
			{boxlabel: $.su.CHAR.WIRELESS.ENABLE, uncheckedValue:"0", inputValue: "1", id:"item_limit", checked:true}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if( newValue.length==0 || newValue[0] ==0){
			$("input#rate_limit_download").textbox('disable');
			$('div#limit_down_block').hide();
			$("input#rate_limit_upload").textbox('disable');
			$('div#limit_up_block').hide();
		}else{
			$("input#rate_limit_download").textbox('enable');
			$('div#limit_down_block').show();
			$("input#rate_limit_upload").textbox('enable');
			$('div#limit_up_block').show();
		}
	});

	$("input#rate_limit_download").textbox('disable');
	$('div#limit_down_block').hide();
	$("input#rate_limit_upload").textbox('disable');
	$('div#limit_up_block').hide();

	$("#limit_form_submit").button({
		text: $.su.CHAR.OPERATION.OK,
		cls:"submit",
		handler:function(){
			if( $('#rate_limit_form').form('validate') == true ){

				var ifChecked = $("input#rate_limit").checkbox('getValue');

				if(ifChecked.length>0 && ifChecked[0] !=false){
					var downloadNum = parseInt( $('#rate_limit_download').textbox('getValue') );

					if(downloadNum<1){
						$('#rate_limit_download').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MIN.replace("%min", 0) );
						return false;
					}

					if( $('#rate_limit_download_unit').combobox('getValue')[0] == '0' ){
						if(downloadNum>10240000){
							$('#rate_limit_download').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240000) );
							return false;
						}
					}else{
						if(downloadNum>10240){
							$('#rate_limit_download').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240) );
							return false;
						}
					}

					var uploadNum = parseInt( $('#rate_limit_upload').textbox('getValue') );
					
					if(uploadNum<1){
						$('#rate_limit_upload').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MIN.replace("%min", 0) );
						return false;
					}

					if( $('#rate_limit_upload_unit').combobox('getValue')[0] == '0' ){
						if(uploadNum>10240000){
							$('#rate_limit_upload').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240000) );
							return false;
						}
					}else{
						if(uploadNum>10240){
							$('#rate_limit_upload').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240) );
							return false;
						}
					}
				}
				
				$('#rate_limit_form').form('submit', {}, function(){
					if($('#client_user_list').hasClass('hidden')){
						var data = $(clientGuestGrid).grid("getStore").getData(editingKey);
						if($("input#rate_limit").checkbox('getValue').length>0 
							&& $("input#rate_limit").checkbox('getValue')[0] !=false){
							data.limit = 1;
						}else{
							data.limit = 0;
						}
						data.limit_download = $('#rate_limit_download').textbox('getValue');
						data.limit_download_unit = $('input#rate_limit_download_unit').combobox('getValue')[0];
						data.limit_upload = $('#rate_limit_upload').textbox('getValue');
						data.limit_upload_unit = $('input#rate_limit_upload_unit').combobox('getValue')[0];
						$(clientGuestGrid).grid("getStore").updateData(data);

						/*$(clientGuestGrid).grid("getStore").load({
							operation: 'load'
						});*/
					}else{
						var data = $(clientGrid).grid("getStore").getData(editingKey);
						if($("input#rate_limit").checkbox('getValue').length>0 
							&& $("input#rate_limit").checkbox('getValue')[0] !=false){
							data.limit = 1;
						}else{
							data.limit = 0;
						}
						data.limit_download = $('#rate_limit_download').textbox('getValue');
						data.limit_download_unit = $('input#rate_limit_download_unit').combobox('getValue')[0];
						data.limit_upload = $('#rate_limit_upload').textbox('getValue');
						data.limit_upload_unit = $('input#rate_limit_upload_unit').combobox('getValue')[0];
						$(clientGrid).grid("getStore").updateData(data);

						/*$(clientGrid).grid("getStore").load({
							operation: 'load'
						});*/
					}
					
					$("#rate_limit_msg").msg('close');
				});				
			}				
		}
	});

	$("#limit_form_submit_cancel").button({
		text: $.su.CHAR.OPERATION.CANCEL,
		cls:"submit",
		handler:function(){
			$("#rate_limit_msg").msg('close');
		}
	});

	if ($.su.managedByController || $.su.isFestaAp) {
		clientGrid.grid("hideColumn", ['key'])
		clientGuestGrid.grid("hideColumn", ['key'])
		blockClientGrid.grid("hideColumn", ['key'])
	}

});
</script>
</body>
</html>
