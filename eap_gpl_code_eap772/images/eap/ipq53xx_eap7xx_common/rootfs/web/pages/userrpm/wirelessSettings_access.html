     	  break;

     }
	 setCipherEn(secType, is2G);
  }
  
  function setCipherEn(secType, is2G){
	var freqSuff = "-5g";
  	if(is2G == "2g")
  	{
  		freqSuff = "-2g";
  	}
  	if(is2G == "5g2")
  	{
  		freqSuff = "-5g2";
  	}
  	if(is2G == "6g")
  	{
  		freqSuff = "-6g";
  	}
		if(is2G == "mlo")
  	{
  		freqSuff = "-mlo";
  	}
	var psk_version = "input#personal-version" + freqSuff;
	var wpa_version = "input#enterprise-version" + freqSuff;
	var psk_cipher = "input#personal-encryption" + freqSuff;
	var wpa_cipher = "input#enterprise-encryption" + freqSuff;
	// $(psk_version).radio("disableAll");
	// $(wpa_version).radio("disableAll");
	if ('3' == secType && $(psk_cipher).combobox("getContainer")){
		var version = $(psk_version).combobox("getValue");
		if(version=='4' || version=='5'){
			$(psk_cipher).radio("disableItem",['1','2']);
		} else {
			$(psk_cipher).radio("enableAll");
		}
	} else if ('2' == secType && $(wpa_cipher).combobox("getContainer")){
		var version = $(wpa_version).combobox("getValue");
		if (version == '4'){
			$(wpa_cipher).radio("disableItem",['1','2']);
		} else {
			$(wpa_cipher).radio("enableAll");
		}
	}
  }

  	function stack5GModeItem(result, stack){
    	var string = result.toString(2);
    	var len = string.length;
		var list = [];
		
    	for(var i=1; i<=len; i++){
    		var index= string.slice(len-i, len-i+1);
    		switch(i){
    			case 1:
    				if(index=='1'){
    					stack.push({value:5, name:$.su.CHAR.WIRELESS.MODE_A});
    				}
    				break;
    			case 2:
    				if(index=='1'){
    					stack.push({value:6, name:$.su.CHAR.WIRELESS.MODE_N});
    				}
    				break;
    			case 3:
    				if(index=='1'){
    					stack.push({value:8, name:$.su.CHAR.WIRELESS.MODE_AC});
    				}
    				break;
    			case 4:
    				if(index=='1'){
    					stack.push({value:14, name:$.su.CHAR.WIRELESS.MODE_AX});
    				}
    				break;
    			case 5:
    				if(index=='1'){
    					stack.push({value:7, name:$.su.CHAR.WIRELESS.MODE_NA});
    				}
    				break;
    			case 6:
    				if(index=='1'){
    					stack.push({value:9, name:$.su.CHAR.WIRELESS.MODE_NAC, selected: "selected"});
    				}
    				break;
    			case 7:
    				if(index=='1'){
    					stack.push({value:10, name:$.su.CHAR.WIRELESS.MODE_NAAC});
    				}
    				break;
    			case 8:
    				if(index=='1'){
    					stack.push({value:15, name:$.su.CHAR.WIRELESS.MODE_AXNAC});
    				}
    				break;
    			case 9:
    				if(index=='1'){
    					stack.push({value:16, name:$.su.CHAR.WIRELESS.MODE_AXNAAC});
    				}
    				break;
    			case 10:
    				if(index=='1'){
    					stack.push({value:19, name:$.su.CHAR.WIRELESS.MODE_AXBE});
    				}
    				break;
    			case 11:
    				if(index=='1'){
    					stack.push({value:18, name:$.su.CHAR.WIRELESS.MODE_AXANACBE});
    				}
    				break;
    		}
    	}
    }

		$.ajax({

	var updateChannelFun = function(radio,channelWidthVal, cbx, val){
		$.ajax({
			url: "./data/channel.json",
			type: 'GET',
			cache:false,
			data: {"radioID":radio, "channelWidth":channelWidthVal},
			dataType: 'json',
			error: function(){return false;},
			success: function(response){
				var found = false;
				var listItem = [];
				for (var index = 0; index < response.data.length; index++)
				{
					if($("div#channel_note").hasClass("hidden"))
                    {
                            //do nothing
                    }
                    else
                    {
                        if(radio == 1 && response.data[index].name != "Auto")
                        {
                            var chan = parseInt(response.data[index].name);
                            if("channelLimit" == $("input#channelLimit").checkbox("getValue") && chan < 100)
                            {
                                    continue;
                            }
                        }
                    }

					var tmp = {};
					tmp.value = response.data[index].value;
					/* if (tmp.value == val){
						found = true;
					} */
					tmp.txPower = response.data[index].txPower;
					tmp.name  = response.data[index].name + "";
					if(radio==3 && nonPsc_6g==='off'){
						if(tmp.name.search('psc') > 0 || tmp.name.search('PSC') > 0){
							listItem.push(tmp);
							if (tmp.value == val){
								found = true;
							}
						}
						if(tmp.name.toUpperCase() == 'AUTO'){
							listItem.push(tmp);
							if (tmp.value == val){
								found = true;
							}
						}
					}else{
						listItem.push(tmp);
						if (tmp.value == val){
							found = true;
						}
					}
				}
				//$("input#chan_width_2g").combobox("loadData", listItem);
				$(cbx).combobox("loadData", listItem);
				$(cbx).get(0).items = listItem;
				if (found){
					// radio==3?$(cbx).combobox("setValue", 0):$(cbx).combobox("setValue", val);
					$(cbx).combobox("setValue", val);
				}else{
					if (response.data.length != 0){
						$(cbx).combobox("setValue", listItem[0].value);
						wirelessBasic6gProxy.write({
							channel: $(cbx).combobox("getValue"),
							radioID: radio
						})
					}
				}
			}
		});
	}

	var updateChannelWidthFun = function(radio, modeVal, cbx, val){
		$.ajax({
			url: "./data/channelWidth.json",
			type: 'GET',
			data: {
				"radioID":radio,
				"mode":modeVal
			},
			dataType: 'json',
			error: function(){return false;},
			success: function(response){
				var found = false;
				var listItem = [];
				for (var index = 0; index < response.data.length; index++)
				{
					var tmp = {};
					tmp.value = response.data[index].value;
					if (tmp.value == val){
						found = true;
					}
					tmp.name  = response.data[index].name + "";
					listItem.push(tmp);
				}
				//$("input#chan_width_2g").combobox("loadData", listItem);
				$(cbx).combobox("loadData", listItem);
				if (found){
					$(cbx).combobox("setValue", val);
				}else{
					if (response.data.length != 0){
						$(cbx).combobox("setValue", listItem[0].value);
					}
				}

				if(channel2gVal!=-1 && radio==0)
					updateChannelFun(radio,val,cbxChannel2g,channel2gVal);
				if(channel5gVal!=-1 && radio==1)
					updateChannelFun(radio,val,cbxChannel5g,channel5gVal);
				if(channel5g2Val!=-1 && radio==2)
					updateChannelFun(radio,val,cbxChannel5g2,channel5g2Val);
				if(channel6gVal!=-1 && radio==3)
					updateChannelFun(radio,val,cbxChannel6g,channel6gVal);
					
				// isSpecifiedCountryVer(cbx);
			}
		});
	}

	function WPAPSK_key_invalid(pwd)
	{
	    var c;
	    var zeronum = 0;
	    var is_Hex = 0;
	    var ch = "0123456789ABCDEFabcdefGHIJKLMNOPQRSTUVWXYZghijklmnopqrstuvwxyz`~!@#$^&*()-=_+[]{};:\'\"\\|/?.,<>/% ";
	    var hexch = ch.substring(0, 22);
	    for (var i = 0; i < pwd.length; i++)
	    {
	    	c = pwd.charAt(i);
	    	if (hexch.indexOf(c) == -1)
	    	{
	    		break;
	    	}
	    }
	    if(i == pwd.length)
	    {
	    	is_Hex = 1;
	    }
	    if (is_Hex == 1) 
	        ch = ch.substring(0, 22);
	    for (var i = 0; i < pwd.length; i++) {
	        c = pwd.charAt(i);
	        if (ch.indexOf(c) == -1) 
	            return false;
	    }
	    if ((pwd.length < 8 || pwd.length > 63) && (is_Hex == 1) )
	            return false;
	    if ((pwd.length < 8 || pwd.length > 63) && (is_Hex == 0) )
	            return false;
	    return true;
	}

	    	}

	    if(i == pwd.length)
	    {
	    	is_Hex = 1;
	    }

	        ch = ch.substring(0, 22);

function checkMloBandEnable (radioId) {
	var value = $("input#mlo-band").checkbox("getCheckedItems")
	var bitMap = [0, 0, 0, 0]
	$.each(value, function (index, item){
		bitMap[bitMap.length - 1 - item.value] = 1
	})

	if (bitMap[bitMap.length - 1 - radioId] == 1) {
		return true
	}
	
	return false
}

function handlerMloBandChange (init) {
	var value = $("input#mlo-band").checkbox("getCheckedItems")
	var bitMap = [0, 0, 0, 0]
	$.each(value, function (index, item){
		bitMap[bitMap.length - 1 - item.value] = 1
	})

	$("input#mlo-band-field").val(parseInt(bitMap.join(''), 2))

	var securityModeItems;
	var mloEncryptionItems
	if (bitMap[bitMap.length - 1 - RADIO.BAND_6G] == 1) {
		securityModeItems = mlo_securityItems_6g
		mloEncryptionItems = encryptionItems6g
	} else {
		securityModeItems = securityItems
		mloEncryptionItems = encryptionItems
	}
	var wpa_cipher = $("#enterprise-encryption-mlo").radio("getValue");
	$("input#enterprise-encryption-mlo").radio("loadData", mloEncryptionItems);
	$("#enterprise-encryption-mlo").radio("setValue", wpa_cipher);

	var securityMode = securityModeMlo.combobox("getValue")[0]

	securityModeMlo.combobox("loadData", securityModeItems)
	if (init) {
		var store = $('div#wireless-ssid-grid-mlo').grid("getStore")
		var rowData = store.getDataByIndex(curIdx5g)
		securityMode = rowData.securityMode
		securityModeMlo.combobox("setValue", '')
	}
	securityMode !== undefined && securityModeMlo.combobox("setValue", securityMode)

	for (var i = 0; i < securityModeItems.length; i++) {
		if (securityModeItems[i].value == securityMode) {
			return
		}
	}

	for (var i = 0; i < securityModeItems.length; i++) {
		if (securityModeItems[i].selected) {
			//强制触发 ev_change
			securityModeMlo.combobox("setValue", '')
			securityModeMlo.combobox("setValue", securityModeItems[i].value)
		}
	}
}

var ssidGridMloStore = new $.su.Store({
	proxy: {
		url: "./data/wireless.mlo.ssids.json",
		timeout: 60000
	},
	fields: mloGridFields,
	autoLoad: false,

$("div#wireless-ssid-grid-mlo").grid({
	store: ssidGridMloStore,
	radioID: 3,
	editor: {
		content: "#own_editor_mlo",
		validator:function(){
			var value = $("input#ssidname_mlo").textbox("getValue");
			var secMode = securityModeMlo.combobox("getValue").toString();
			// 重复性检查
			var store = $('div#wireless-ssid-grid-mlo').grid("getStore");
			var data = store.data;
			var index = 0;
			var num = data.length;
			var idx = curIdx5g;
			
			for (index = 0; index < num; index++)
			{
				if (value == data[index].ssidname && index != idx)
				{
					$("input#ssidname_mlo").textbox("setError", $.su.CHAR.WIRELESS.SSID_EXIST);
					return false;
				}
			}
			
			var checkedItems = $("input#mlo-band").checkbox("getCheckedItems")
			var bitMap = [0, 0, 0, 0]
			$.each(checkedItems, function (index, item){
				bitMap[bitMap.length - 1 - item.value] = 1
			})
			var bitMapIndex2g = bitMap.length -1 - RADIO.BAND_24G
			var bitMapIndex5g = bitMap.length -1 - RADIO.BAND_5G
			var bitMapIndex6g = bitMap.length -1 - RADIO.BAND_6G

			// mlo的ssidName不能与其他的频段已有ssidName一致
			var data2g = $('div#wireless-ssid-grid').grid("getStore").data;
			if (bitMap[bitMapIndex2g] && checkMloSsidNameExist(value, data2g) == false) {
				return false
			}
			var data5g = $('div#wireless-ssid-grid-5ghz').grid("getStore").data;
			if (bitMap[bitMapIndex5g] && checkMloSsidNameExist(value, data5g) == false) {
				return false
			}
			var data5g2 = $('div#wireless-ssid-grid-5ghz-2').grid("getStore").data;
			if (bitMap[bitMapIndex5g] && checkMloSsidNameExist(value, data5g2) == false) {
				return false
			}
			var data6g = $('div#wireless-ssid-grid-6ghz').grid("getStore").data;
			if (bitMap[bitMapIndex6g] && checkMloSsidNameExist(value, data6g) == false) {
				return false
			}
			
			//至少选择两个频段
			var mlBand = $("input#mlo-band").checkbox('getValue')
			if (mlBand.length < 2) {
				$("#mlo-error-tip").text($.su.CHAR.WIRELESS.MLO_BAND_ERROR_TIP);
				$("div#error-msg").msg('show');
				return false;
			}

			//各频段数量加上mlo的数量不能超过最大数量限制

			var oldMloBitMap = [0, 0, 0, 0]
			if (idx !== -1) {
				oldMloBitMap = data[idx].ml.toString(2).padStart(4, 0).split('')
			}

			var ssidNumLimitBandsText = []
			
			var store2g = $('div#wireless-ssid-grid').grid("getStore")
			var ssidNumLimit2g = (bitMap[bitMapIndex2g] && oldMloBitMap[bitMapIndex2g] != 1) && store2g.data.length >= $('div#wireless-ssid-grid').grid("getMaxRules");
			if (ssidNumLimit2g) {
				ssidNumLimitBandsText.push($.su.CHAR.MODE.MODE_2G)
			}

			if ($.su.dutMode !== DUT_MODE.BAND_24G) {
				var store5g = $('div#wireless-ssid-grid-5ghz').grid("getStore")
				var ssidNumLimit5g = (bitMap[bitMapIndex5g] && oldMloBitMap[bitMapIndex5g] != 1) && store5g.data.length >= $('div#wireless-ssid-grid-5ghz').grid("getMaxRules");
				if (ssidNumLimit5g) {
					ssidNumLimitBandsText.push($.su.CHAR.MODE.MODE_5G)
				}
			}
			
			if ($.su.dutMode === DUT_MODE.BAND_24G_5G1_5G2_6G || $.su.dutMode === DUT_MODE.BAND_24G_5G_6G) {
				var store6g = $('div#wireless-ssid-grid-6ghz').grid("getStore")
				var ssidNumLimit6g = (bitMap[bitMapIndex6g] && oldMloBitMap[bitMapIndex6g] != 1) && store6g.data.length >= $('div#wireless-ssid-grid-6ghz').grid("getMaxRules");
				if (ssidNumLimit6g) {
					ssidNumLimitBandsText.push($.su.CHAR.MODE.MODE_6G)
				}
			}

			if (ssidNumLimitBandsText.length) {
				$("#mlo-error-tip").text($.su.CHAR.WIRELESS.MLO_SSID_NUM_LINIT_TIP.replace("{band}", $.su.getBatchStr(ssidNumLimitBandsText)));
				$("div#error-msg").msg('show');
				return false;
		}

			//wireless mode为非11be的频段不能用作mlo
			var wirelessModeIsNotBe2g = bitMap[bitMap.length -1 - RADIO.BAND_24G] && wirelessModeBeList2g.indexOf(wirelessMode2g) === -1
			if (wirelessModeIsNotBe2g) {
				$("#mlo-error-tip").text($.su.CHAR.WIRELESS.MLO_WIRELESS_MODE_TIP.replace("{band}", $.su.CHAR.MODE.MODE_2G));
				$("div#error-msg").msg('show');
				return false;
			}

			if ($.su.dutMode !== DUT_MODE.BAND_24G) {
				var wirelessModeIsNotBe5g = bitMap[bitMap.length -1 - RADIO.BAND_5G] && wirelessModeBeList5g.indexOf(wirelessMode5g) === -1
				if (wirelessModeIsNotBe5g) {
					$("#mlo-error-tip").text($.su.CHAR.WIRELESS.MLO_WIRELESS_MODE_TIP.replace("{band}", $.su.CHAR.MODE.MODE_5G));
					$("div#error-msg").msg('show');
					return false;
				}
			}

			if ($.su.dutMode === DUT_MODE.BAND_24G_5G1_5G2_6G || $.su.dutMode === DUT_MODE.BAND_24G_5G_6G) {
				var wirelessModeIsNotBe6g = bitMap[bitMap.length -1 - RADIO.BAND_6G] && wirelessModeBeList5g.indexOf(wirelessMode6g) === -1
				if (wirelessModeIsNotBe6g) {
					$("#mlo-error-tip").text($.su.CHAR.WIRELESS.MLO_WIRELESS_MODE_TIP.replace("{band}", $.su.CHAR.MODE.MODE_6G));
					$("div#error-msg").msg('show');
					return false;
				}
			}

			var ifChecked = $("input#rate_limit_mlo").checkbox('getValue');

			if(ifChecked.length>0 && ifChecked[0] !=false){
				var downloadNum = parseInt( $('#rate_limit_download_mlo').textbox('getValue') );

				if(downloadNum<1){
					$('#rate_limit_download_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MIN.replace("%min", 0) );
					return false;
				}

				if( $('#rate_limit_download_unit_mlo').combobox('getValue')[0] == '0' ){
					if(downloadNum>10240000){
						$('#rate_limit_download_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240000) );
						return false;
					}
				}else{
					if(downloadNum>10240){
						$('#rate_limit_download_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240) );
						return false;
					}
				}

				var uploadNum = parseInt( $('#rate_limit_upload_mlo').textbox('getValue') );

				if(uploadNum<1){
					$('#rate_limit_upload_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MIN.replace("%min", 0) );
					return false;
				}

				if( $('#rate_limit_upload_unit_mlo').combobox('getValue')[0] == '0' ){
					if(uploadNum>10240000){
						$('#rate_limit_upload_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240000) );
						return false;
					}
				}else{
					if(uploadNum>10240){
						$('#rate_limit_upload_mlo').textbox('setError', $.su.CHAR.VTYPETEXT.NUMBER_MAX.replace("%max", 10240) );
						return false;
					}
				}
			}

				

			curIdx5g = -1;
			return true;
		},
		fields: mloGridFields
	},
	paging:{

	} ,		
	columns: [
		/*{
			xtype: "checkcolumn", 
			width: 32
		},*/
		{
			xtype: "rownumberer",
			width: 50
		},
		{
			text: $.su.CHAR.WIRELESS.WIRELESS_SSID_NAME, 
			dataIndex: "ssidname"
		},
		{
			text: $.su.CHAR.WIRELESS.WIRELESS_SSID_BAND, 
			width: 80,
			dataIndex: "ml",
			renderer:function(val)
			{
				var radio = []

				var mlBitMap = val.toString(2).split('')
				var mlData = []
				$.each(mlBitMap, function (index, item) {
					if (item == 1) {
						mlData.push(mlBitMap.length - 1 - index)
					}
				})
				$.each(mlData, function (index, item) {
					switch (item) {
						case RADIO.BAND_24G:
							radio.unshift($.su.CHAR.MODE.MODE_2G)
							break;
						case RADIO.BAND_5G:
							radio.unshift($.su.CHAR.MODE.MODE_5G)
							break;
						case RADIO.BAND_6G:
							radio.unshift($.su.CHAR.MODE.MODE_6G)
							break;
					}
				})

				return radio.join(',<br>')
			}
		},
		{
			text: $.su.CHAR.WIRELESS.WIRELESS_SSID_VID, 
			width: 80,
			dataIndex: "vlanid"

	var enableBand6g = false

	$.each(data, function(index, item) {
		var mlBitMap = item.ml.toString(2).split('')
		var mlData = []
		if (mlBitMap[mlBitMap.length - 1 - RADIO.BAND_24G] == 1) {
			ssidMloCount[RADIO.BAND_24G]++
			enableBand2g = true
		}
		if (mlBitMap[mlBitMap.length - 1 - RADIO.BAND_5G] == 1) {
			ssidMloCount[RADIO.BAND_5G]++
			enableBand5g = true
		}
		if (mlBitMap[mlBitMap.length - 1 - RADIO.BAND_6G] == 1) {
			ssidMloCount[RADIO.BAND_6G]++
			enableBand6g = true
		}

	$('div#wireless-ssid-grid-6ghz').grid("setMaxRules", defaultMaxRules - ssidMloCount[RADIO.BAND_6G])

	var wirelessModeItems = []
	if (enableBand2g) {
		wirelessModeItems = []
		$.each(wlan_2g_mode_items, function (index, item) {
			if (wirelessModeBeList2g.indexOf(item.value) !== -1) {
				wirelessModeItems.push(item)
			}
		})
		var wirelessModeValue = $("input#wireless_mode_2g").combobox("getValue")
		$("input#wireless_mode_2g").combobox("loadData", wirelessModeItems)
		$("input#wireless_mode_2g").combobox("setValue", wirelessModeValue)
	}

	if (enableBand5g) {
		wirelessModeItems = []
		$.each(wlan_5g_mode_items, function (index, item) {
			if (wirelessModeBeList5g.indexOf(item.value) !== -1) {
				wirelessModeItems.push(item)
			}
		})
		var wirelessModeValue = $("input#wireless_mode_5g").combobox("getValue")
		$("input#wireless_mode_5g").combobox("loadData", wirelessModeItems)
		$("input#wireless_mode_5g").combobox("setValue", wirelessModeValue)
	}
	if (enableBand6g) {
		wirelessModeItems = []
		$.each(wlan_6g_mode_items, function (index, item) {
			if (wirelessModeBeList5g.indexOf(item.value) !== -1) {
				wirelessModeItems.push(item)
			}

		$("input#wireless_mode_6g").combobox("setValue", wirelessModeValue)
	}

	$('#band_enable_confirm_text').html($.su.CHAR.WIZARD.BAND_ENABLE_CONFIRM_TIP);
	$("div#band_enable_confirm_msg").msg({
		type: "confirm",
		cls: 'm',
		closeBtn: false,
		_title: $.su.CHAR.WIZARD.BAND_ENABLE_CONFIRM_TITLE,
		okHandler: function(e){
			$("#wireless-bset-form-" + currentBand).form("submit");
		}
	});

	var checkBandEnableSettings = function (band) {
		currentBand = band;
		if ($.su.dutMode !== DUT_MODE.BAND_24G_5G1_5G2_6G && $.su.dutMode !== DUT_MODE.BAND_24G_5G_6G) {
			return true;
		}

		var res = false;
		var enableLen = $('#wireless-bset-status-' + band).checkbox('getValue').length;
		if (enableLen !== 0) {
			return true;
		}
		

		if (!radioEnable[band]) {
			return true;
		}

		if (!radioEnable[BAND.BAND_6G]) {
			return true;
		}

		$.each(BAND, function (key, value) {
			if (band === value) {
				return true;
			}
			if (value === BAND.BAND_6G) {
				return true;
			}
			if (value === BAND.BAND_5G2 && $.su.dutMode == DUT_MODE.BAND_24G_5G_6G) {
				return true;
			}

			if (radioEnable[value]) {
				res = true;
				return false;
			}
		})

		if (!res) {
			$("#band_enable_confirm_msg").msg('show');
			return false;
		}

		return true;
	}

	$("#confirm_reboot").html($.su.CHAR.REBOOT_RESET.CONFIRM_REBOOT);

	var pro_bar = $('#pro_bar').progressbar({
		fieldLabel: null,
		cls: 'inline',
		width: 300,
		height: 6,
		value: 0
	});

	$("#reboot_button").button({
		labelCls:"xl",
		text:$.su.CHAR.REBOOT_RESET.REBOOT,
		cls: "hidden",
		handler:function(){
			$("#reboot_alert_cnt").msg("show");
		},
	});

	$("#reboot_alert_cnt").msg({
		okHandler:function(){
			$("button#reboot_button").button("disable");

			$("#pro_cnt").fadeIn(200);
			$.su.mask.show();

			$.ajax({
				url: REBOOT_URL,
				type: 'GET',
				data: {},
				dataType: 'json',
				cache:false,
				error: function(){return false;},
				success: function(result){
					if (true == result.timeout)
					{
						window.top.location.href = "/";
					}
					var protocol = document.location.protocol;

					if(protocol.toUpperCase() == 'HTTPS:'){
						$('input#pro_bar').progressbar("animate", 0, 1, protocalTime);
						setTimeout('location=location', protocalTime);
					} else {
						$('input#pro_bar').progressbar("animate", 0, 1, reboot_time, function(){
							location = location;
						});
						var hasHandled = false;
						setTimeout(function(){
							var checkServer = setInterval(function(){
								connectProxy.read({}, function(){
									if(!hasHandled){
										hasHandled = true;
										clearInterval(checkServer);
										$('input#pro_bar').progressbar("stop");
										$('input#pro_bar').progressbar("animate", $('input#pro_bar').progressbar("getValue"), 1, 5000, function(){
											location=location;
										});
									}
								});
							}, 10000);
						}, 10000);
					}
					$.su.mask.show();
				}

			});
		},
		
		cancelHandler:function(){
		return true;
		},
		type: "prompt",
		cls:"m"
	});

	if ($.su.supportPowerDetect) {
		var bandArr = ['2g', '5g', '5g2', '6g']
		showModeProxy.read({}, function (data) {
			showMode = data.showMode;
			powerArray = data.powerArray || []
			limitBands = []
			if (showMode === SHOW_MODE.SHOW_REBOOT) {
				$("#wireless_settings_containner").hide();
				$("#wireless-freq").hide();

				$("#insufficient_power_title").html($.su.CHAR.WIRELESS.REBOOT_DEVICE);
				$("#insufficient_power_content").html($.su.CHAR.WIRELESS.REBOOT_DEVICE_CONTENT);
				$("#reboot_button").button("getContainer").show();
				$("#insufficient_power_note").show();

				return
			}

			var disableBandCount = 0
			for (var i = 0; i < powerArray.length; i++) {
				if (powerArray[i].status === BAND_POWER_MODE.BAND_CLOSE) {
					limitBands.push($('#show_' + bandArr[i]).html())
				} else if (!bandSupport[i]) {
					disableBandCount ++
				}

				if (powerArray[i].status === BAND_POWER_MODE.POWER_LIMIT) {
					$("#power-limit-help-" + bandArr[i]).removeClass("hidden")
					limitMaxPwrArr.push(powerArray[i].limitMaxPwr)
				} else {
					limitMaxPwrArr.push(0)
				}
			}

			if (limitBands.length + disableBandCount === powerArray.length) {
				// 所有频段都关闭
				$("#wireless_settings_containner").hide();
				$("#wireless-freq").hide();

				$("#insufficient_power_title").html($.su.CHAR.WIRELESS.INSUFFICIENT_POWER_TITLE);
				$("#insufficient_power_content").html($.su.CHAR.WIRELESS.INSUFFICIENT_POWER_CONTENT);
				$("#reboot_button").button("getContainer").hide();
				$("#insufficient_power_note").show();
			} else {
				$("#wireless_settings_containner").show();
					$("#wireless-freq").show();

					$("#insufficient_power_title").html($.su.CHAR.WIRELESS.INSUFFICIENT_POWER_TITLE);
					$("#reboot_button").button("getContainer").hide();
					$("#insufficient_power_note").hide();
			}

		})
	} else {
		$("#wireless_settings_containner").show();
		$("#wireless-freq").show();
		$("#reboot_button").button("getContainer").hide();
		$("#insufficient_power_note").hide();
	}
});
