<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>MAC Filtering</title>
<style type="text/css">
	div#profile_name_grid{
		float:left;
		width:365px;
	}
	div#profile_rule_grid{
		float:right;

	}

	div.arrow{
		/*height: 100%;

<body>
<div class="func-container">
	<div id="set"> 
		<form id="set_form">
			<input type="checkbox" id="scheduler_enable" name="status" type="text"/>
            <input id="scheduler_type" name="scheduler_type" >
		</form>
		<br />
	</div>

	<div id="profile" class="hidden"> 
		<div id="empty_add" onClick="addMacList()" >
			<span class="empty_add"></span>
			<span class="text" id="text_create" style="color:#4ACBD6"></span>
		</div>

		<div id="profile_name_grid" name="profile_name_grid" ></div>

		<div class="arrow" >
			<div class="arrow-wrap-1" id="arrow">
				<div class="arrow-wrap-2">
					<span class="arrow-right" ></span>
				</div>
			</div>
		</div>

		<div id="profile_rule_grid" name="profile_rule_grid" ></div>

		<div class="clear"></div>

	<div id="association" class="hidden">
		<form id="assoc_form">
			<div id="assoc_entry" name="assoc_entry"></div>
		</form>
		<form id="assoc_form_ap" >
			<div id="assoc_entry_ap" name="assoc_entry_ap" style="display:none"></div>
			<button type="button" id="total_save"></button>
		</form>

		<div id="config_loading">
			<!-- <span class="icon" ></span> -->
		</div>
	</div>

<div id="profile_editor">
	<input type="text" id="profileName_txt" name="profileName" />
</div>

<div id="rule_setting">
	<div id="hide_profile">
		<input type="text" id="proName" name="proName" />
	</div>
    <div id="week_day">
		<input type="text" id="weekDay" name="weekDay" />
        <input type="checkbox" id="dayVal_mon" name="dayVal_mon" />
        <input type="checkbox" id="dayVal_tue" name="dayVal_tue" />
        <input type="checkbox" id="dayVal_wed" name="dayVal_wed" />
        <input type="checkbox" id="dayVal_thu" name="dayVal_thu" />
        <input type="checkbox" id="dayVal_fri" name="dayVal_fri" />
        <input type="checkbox" id="dayVal_sat" name="dayVal_sat" />
        <input type="checkbox" id="dayVal_sun" name="dayVal_sun" />
    </div>
    <div id="time_set">
        <input type="text" id="allDay" name="allDay" />
    </div>
    <div id="start_time">
		<input type="text" id="start_hour" name="start_hour" />
		<span id="st_span_ms" ></span>
        <input type="text" id="start_min" name="start_min"  />
        <!--span id="st_span_hrs" ></span-->
    </div>
    <div id="end_time">
		<input type="text" id="end_hour" name="end_hour"  />
		<span id="st_span_ms" ></span>
        <input type="text" id="end_min" name="end_min"  />
        <!--span id="st_span_hrs" ></span-->
    </div>
</div>

	</div>

	
</div>

		

<div id="rule_add_alert">
	<div class="grid-warning-msg warning">
		<h4 class="title">
		<span class="icon"></span>
		<span class="text" id="cancel_add"></span>
		</h4>
	</div>
</div>

<script type="text/javascript">

function addMacList(){
	$("div#profile_name_grid").show();
	$("div#arrow").show();
	$("div#profile_rule_grid").show();
	$("div#empty_add").hide();
}

$('span#text_create').text($.su.CHAR.SCHEDULER.CREATE_PROFILES);

$(document).ready(function(e){

/////////////////////////////////////////////////////////////////////////////

	var SCHEDULER_URL = "./data/scheduler.json";
	var SCHEDULER_SET_URL = "./data/scheduler.set.json";
	var SCHEDULER_PROFILE_URL = "./data/scheduler.profile.json";
	var SCHEDULER_RULE_URL = "./data/scheduler.rule.json";
	var SCHEDULER_ASSOCIATION_URL = "./data/scheduler.association.json";
	var SCHEDULER_ASSOCIATIONAP_URL = "./data/scheduler.associationAp.json"
	var mode;
	var gItem = [];
	var hour_item = [];
	var min_item = [];
	var g_profile = null;
	var curIdx = -1;
	var curRuleIdx = -1;
	var flag = 0;
	var ssid_asso_commit = null;
	var profileName_commit = [];

	var DUT_MODE = {
		BAND_24G: 0,
		BAND_24G_5G: 1,
		BAND_24G_5G1_5G2: 2,
		BAND_24G_5G_6G: 3,
		BAND_24G_5G1_5G2_6G: 4
	};
	
	for (var index = 0; index < 24; index++)
	{
		var tmp = {};
		
		if (index < 10)
			index = '0' + index;
		tmp.name = index;
		tmp.value = index;
		hour_item.push(tmp);
		min_item.push(tmp);
	}
	
	for (var index = 24; index < 60; index++)
	{
		var tmp = {};
		
		tmp.value = index;
		tmp.name  = index + "";
		min_item.push(tmp);
	}

	$('div.func-container').page({
		title: $.su.CHAR.SCHEDULER.TITLE,
		help: ""	//可能是个调用的id 也可能是个url
	});
	
	$('div#set').panel({
		title: $.su.CHAR.SCHEDULER.SETTING,
		collapsible: false
	});

	$('div#profile').panel({
		title: $.su.CHAR.SCHEDULER.PROFILE,
		collapsible: false
	});
	$('div#association').panel({
		title: $.su.CHAR.SCHEDULER.ASSOCIATION,
		collapsible: false
	});
	
	/*             SETTING             */
	$('#set_form').form({
		proxy: {
			timeout: 30000,
			url: SCHEDULER_SET_URL
		},
		fields: [
			{name: "status", mapping: "status"},
			{name: "scheduler_type", mapping: "scheduler_type"}
		],
		autoLoad:true,
		submitBtn: "default"
	}).on("ev_loadData", function(e, data){
		mode = data.scheduler_type;

		if (mode == 1)
		{
			$("div#assoc_entry").hide();
			$("div#assoc_entry_ap").show();
			// setTimeout(getAssociationApFunc, 2000);
		}
		else
		{
			$("div#assoc_entry").show();
			$("div#assoc_entry_ap").hide();
			// setTimeout(getAssociationFunc, 2000);
		}
	});
	$('input#scheduler_enable').checkbox({
		fieldLabel: $.su.CHAR.SCHEDULER.SCHEDULER,
		items:[
			{boxlabel: $.su.CHAR.SCHEDULER.ENABLE, inputValue:"on", uncheckedValue:"off", checked:false}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if( newValue.length==0 || newValue[0] =='off' || newValue[0] ==false || newValue[0] ==0){
			$('div#profile').hide();
			$('div#association').hide();
		}else{
			$('div#profile').show();
			$('div#association').show();
		}
	});

	$('input#scheduler_type').combobox({
		fieldLabel: $.su.CHAR.SCHEDULER.TYPE,
		items:[
			{"value":"0", "name": $.su.CHAR.SCHEDULER.TYPE_SSID},
			{"value":"1", "name": $.su.CHAR.SCHEDULER.TYPE_AP}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if (oldValue == "0" && newValue == "1")
		{
			mode = 1;
			$("div#assoc_entry").hide();
			$("div#assoc_entry_ap").show();
			getAssociationApFunc();
		}
		else if (oldValue == "1" && newValue == "0")
		{
			mode = 0;
			$("div#assoc_entry").show();
			$("div#assoc_entry_ap").hide();
			getAssociationFunc();
		}
	});
	
	/*       		END SETTING				*/
	
	// 获得Rule列表
	function getRuleFunc(profileName){
		/*$.ajax({
			url: SCHEDULER_RULE_URL+"?profileName="+profileName,
			type: 'GET',
			data: {},
			dataType: 'json',
			cache: false,
			error: function(){
				alert("Get Rule Error!");
				return false;
			},
			success: function(result){
				// console.log("getRuleFunc")
				$('div#profile_rule_grid').grid("getStore").loadData(result.data, false, null);
				return true;
			}
		});*/
		$('div#profile_rule_grid').grid("getStore").load({"profileName":profileName});
	}
	// 获得profile列表
	getProfileFunc();
	
	function getProfileFunc(){
		// console.log(0001)
		$.ajax({
			url: SCHEDULER_PROFILE_URL,
			type: 'GET',
			data: {
			},
			dataType: 'json',
			async:false,
			cache:false,
			error: function(){
				//alert("error");
				return false;
			},
			success: function(result){
				// console.log(0002)
				var index = 0;
				var data = result.data;
				
				gItem = [];

				if (data.length > 0)
				{			
					for (index = 0; index < data.length; index++)
					{
						var tmp = {};
						tmp.value = data[index].profileName;
						tmp.name  = data[index].profileName;
						gItem.push(tmp);		
						profileName_commit[index] = data[index].profileName;
					}
				}

				var tmp = {};
				tmp.value = "++++";
				tmp.name  = $.su.CHAR.SCHEDULER.NONE;
				gItem.unshift(tmp);
			}
		});

		// console.log(0003)
	}
	
	
	var hide_profile_field = $('#hide_profile').fieldset({
		fields:[
			{name: "proName"}
		]
	});
	
	var week_day_field = $('#week_day').fieldset({
		fields:[
			{name: "weekDay"},
			{name: "dayVal_mon"},
			{name: "dayVal_tue"},
			{name: "dayVal_wed"},
			{name: "dayVal_thu"},
			{name: "dayVal_fri"},
			{name: "dayVal_sat"},
			{name: "dayVal_sun"}
		]
	});
		
	var time_set_field = $('#time_set').fieldset({
		fields:[
			{name: "allDay"}
		]
	});
	
	var start_time_field = $('#start_time').fieldset({
			fields:[
				{name: "start_hour"},
				{name: "start_min"}
			]
	});
	
	var end_time_field = $('#end_time').fieldset({
			fields:[
				{name: "end_hour"},
				{name: "end_min"}
			]
	});
	
	$("input#proName").textbox({
		//fieldLabel: $.su.CHAR.SCHEDULER.PROFILE_NAME,
		name: "proName",
		cls: "hidden"
	});
	
	$("input#weekDay").radio({
		fieldLabel: $.su.CHAR.SCHEDULER.DAY,
		labelCls:"xxs",
		name:$.su.CHAR.SCHEDULER.WEEK_DAY,
		columns:4,
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.WEEKDAY, inputValue:"0"},
			{boxlabel:$.su.CHAR.SCHEDULER.WEEKEND, inputValue:"1"},
			{boxlabel:$.su.CHAR.SCHEDULER.EVERYDAY, inputValue:"2"},
			{boxlabel:$.su.CHAR.SCHEDULER.SELECTDAY, inputValue:"3"}
		]
	}).on('ev_change', function(e, oldValue, newValue){
		// flag用来标记已经点击过radio
		flag = 1;
		if (newValue == "0")
		{
			selectWeekday();
		}
		else if (newValue == "1")
		{
			selectWeekend();
		}
		else if (newValue == "2")
		{
			selectEveryday();
		}
		else if (newValue == "3")
		{
			selectDays();
		}
	});
	
	$("input#dayVal_mon").checkbox({
		fieldLabel: null,
		labelCls:"xxs",
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.MONDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_tue").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.TUESDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_wed").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.WEDNESDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_thu").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.THUSDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_fri").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.FRIDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_sat").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.SATURDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	$("input#dayVal_sun").checkbox({
		fieldLabel: null,
		cls:"inline",
		items:[
			{boxlabel:$.su.CHAR.SCHEDULER.SUNDAY, inputValue:"1", uncheckedValue:"0"}
		]
	});
	
	$("input#allDay").checkbox({
		fieldLabel: $.su.CHAR.SCHEDULER.TIME,
		labelCls:"xxs",
		columns:1,
		items:[
			{boxlabel: $.su.CHAR.SCHEDULER.ALLDAY, name:"dayTime", uncheckedValue:"0", inputValue:"1"}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		if (newValue == "dayTime")
		{
			// 使时间选择不可用
			$("input#start_hour").combobox('setNormal');
			$("input#start_min").combobox('setNormal');
			$("input#end_hour").combobox('setNormal');
			$("input#end_min").combobox('setNormal');
			
			$("input#start_hour").combobox("setValue", 0);
			$("input#start_min").combobox("setValue", 0);
			$("input#end_hour").combobox("setValue", 23);
			$("input#end_min").combobox("setValue", 59);
			setTimeSlt(true);
		}
		else
		{
			setTimeSlt(false);
		}
	});
	
	$("input#start_hour").combobox({
		fieldLabel: $.su.CHAR.SCHEDULER.START_TIME,
		noneSelectedText: $.su.CHAR.OPERATION.NOSELECTEDTEXT,
		labelCls:"xxs",
		cls:"inline-block",
		inputCls:'s',
		// tips: $.su.CHAR.SCHEDULER.MH,
		items:hour_item
	});

	$("span#st_span_ms").html($.su.CHAR.SCHEDULER.MH);

	$("input#start_min").combobox({
		fieldLabel:null,
		noneSelectedText: $.su.CHAR.OPERATION.NOSELECTEDTEXT,
		cls:"inline-block",
		inputCls:'s',
		// tips: $.su.CHAR.SCHEDULER.HRS,
		items:min_item
	});

	//$("span#st_span_hrs").html($.su.CHAR.SCHEDULER.HRS);

	$("input#end_hour").combobox({
		fieldLabel: $.su.CHAR.SCHEDULER.END_TIME,
		noneSelectedText: $.su.CHAR.OPERATION.NOSELECTEDTEXT,
		labelCls:"xxs",
		cls:"inline-block",
		inputCls:'s',
		// tips: $.su.CHAR.SCHEDULER.MH,
		items:hour_item
	});

	$("input#end_min").combobox({
		fieldLabel:null,
		noneSelectedText: $.su.CHAR.OPERATION.NOSELECTEDTEXT,
		cls:"inline-block",
		inputCls:'s',
		// tips: $.su.CHAR.SCHEDULER.HRS,
		items:min_item
	});

	$('input#profileName_txt').textbox({
		fieldLabel: $.su.CHAR.SCHEDULER.PROFILE,
		labelCls:"xxs",
		lengthText:$.su.CHAR.SCHEDULER.LENERROR,
		minLength:"1",
		maxLength:"31",
		hint:$.su.CHAR.SCHEDULER.PROFILE_NAME,
        allowBlank:false,
        vtype:"string_strict_strict"
	});
	
	var pn = $("div#profile_name_grid").grid({
		store:{
			proxy:{
				url: SCHEDULER_PROFILE_URL
			},
			fields:[
				{name:"profileName"}
			],
			updateMode:"complete",
			autoLoad: true
		},
		editor: {
			content:"#profile_editor",
			validator:function(){
				var value = $("input#profileName_txt").textbox("getValue");

				/*
				if (value.length >= 32)
				{
					$("input#profileName_txt").textbox("setError", $.su.CHAR.SCHEDULER.LENERROR);
					return false;
				}
				*/
				// 重复性检查
				var store = $('div#profile_name_grid').grid("getStore");
	        	var data = store.data;
	        	var index = 0;
	        	var num = data.length;

	        	for (index = 0; index < num; index++)
	        	{
	        		if (value == data[index].profileName && index != curIdx)
	        		{
	        			$("input#profileName_txt").textbox("setError", $.su.CHAR.SCHEDULER.DUPERROR);
	        			return false;
	        		}
	        	}

				return true;
			},
			fields:[
				{name:"profileName"}
			]
		},
		paging:{
		},
		columns:[
			{
				text:$.su.CHAR.SCHEDULER.PROFILE_NAME,
				dataIndex:"profileName",
				width:280
			},
			{
				xtype:"settings"
				// width:60
			}
		],
		operation:"add-lp"
	}).on("ev_load", function(e, data, start, len){

		curIdx = -1;
		if (data.length == 0)
		{
			// console.log("profile_rule_grid 001")
			$("div#profile_rule_grid").grid("getStore").loadData(null, false, null);
			$("div#profile_name_grid").hide();
			$("div#arrow").hide();
			$("div#profile_rule_grid").hide();
			$("div#empty_add").show();
		}
		else
		{
			for (index = 0; index < data.length; index ++)
			{
				profileName_commit[index] = data[index].profileName;
			}
			$("div#profile_name_grid .grid-content-container table tr:first").trigger("click");
			$("div#empty_add").hide();
		}
	});
	// console.log("profile_rule_grid")
	var o = $("div#profile_rule_grid").grid({
		maxRulesMsgText: $.su.CHAR.OPERATION.GRID_MAX_GROUPS,
		store:{
			proxy: {
				url: SCHEDULER_RULE_URL
			},
			fields: [
				{name: "profile"},
				{name: "dayOpt"},
				{name: "dayVal_mon"},
				{name: "dayVal_tue"},
				{name: "dayVal_wed"},
				{name: "dayVal_thu"},
				{name: "dayVal_fri"},
				{name: "dayVal_sat"},
				{name: "dayVal_sun"},
				{name: "tStart"},
				{name: "tEnd"},
				{name: "allDay"}
			],
			updateMode:"complete",
			autoLoad: true
		},
		beforeStartAdd:function(){
			var store = $("div#profile_name_grid").grid("getStore");
			var data = store.data;

			if (data.length == 0)
			{
				$("#rule_add_alert").msg("show");
				return false;
			}
			return true;
		},
		editor: {
			content:"#rule_setting",
			validator:function(){
				var wd  = $("input#weekDay").radio("getValue");
				var mon = $("input#dayVal_mon").checkbox("getValue");
				var tue = $("input#dayVal_tue").checkbox("getValue");
				var wed = $("input#dayVal_wed").checkbox("getValue");
				var thu = $("input#dayVal_thu").checkbox("getValue");
				var fri = $("input#dayVal_fri").checkbox("getValue");
				var	sat	= $("input#dayVal_sat").checkbox("getValue");
				var	sun	= $("input#dayVal_sun").checkbox("getValue");
				var all = $("input#allDay").checkbox("getValue");
				var sh  = $("input#start_hour").combobox("getValue");
				var sm  = $("input#start_min").combobox("getValue");
				var eh  = $("input#end_hour").combobox("getValue");
				var em  = $("input#end_min").combobox("getValue");
				var len = 0;

				// $("input#proName").textbox("setValue", g_profile);
				var profile = $("input#proName").textbox("getValue");

				if (profile == null || profile.length == 0)
				{
					$("input#weekDay").radio("setError", $.su.CHAR.SCHEDULER.PROFILEEMPTY);
					return false;
				}
				
				if (wd == "")
				{
					$("input#weekDay").radio("setError", $.su.CHAR.SCHEDULER.WEEKDAYERROR);
					return false;
				}
				else
				{
					flag = 1;
				}

				// 点击过radio之后，如果checkbox选中则长度为1，没有选中则为0；
				// 没有点击radio的话，选中长度为2，没有选中则为1。
				len = flag ^ 0x01;
				//如果flag为1，并且wd为3，那如果mon~sun的长度均为0，则出错；
				//如果flag为0，并且wd为3，那如果mon~sun的长度均为1，则出错。
				if (wd == 3)
				{
					// 至少要选择一天
					if (mon.length == len && tue.length == len && wed.length == len &&
						thu.length == len && fri.length == len && sat.length == len &&
						sun.length == len)
					{
						$("input#dayVal_mon").checkbox("setError", $.su.CHAR.SCHEDULER.DAYERROR);
						return false;
					}
				}
				
				// 没有选择开始时间hour
				if (sh.length == 0)
				{
					$("input#start_hour").combobox("setError", $.su.CHAR.SCHEDULER.SHERROR);
					return false;
				}
				// 没有选择开始时间minute
				if (sm.length == 0)
				{
					$("input#start_min").combobox("setError", $.su.CHAR.SCHEDULER.SMERROR);
					return false;
				}
				// 没有选择结束时间hour
				if (eh.length == 0)
				{
					$("input#end_hour").combobox("setError", $.su.CHAR.SCHEDULER.EHERROR);
					return false;
				}
				// 没有选择结束时间minute
				if (em.length == 0)
				{
					$("input#end_min").combobox("setError", $.su.CHAR.SCHEDULER.EMERROR);
					return false;
				}
				// 开始时间晚于结束时间hour
				if (sh[0] > eh[0])
				{
					$("input#end_hour").combobox("setError", $.su.CHAR.SCHEDULER.TIMEERROR);
					return false;
				}
				// 开始时间晚于结束时间minute
				if (sh[0] == eh[0] && sm[0] >= em[0])
				{
					$("input#end_min").combobox("setError", $.su.CHAR.SCHEDULER.TIMEERROR);
					return false;
				}
				
				if (sh[0] == 0 && sm[0] == 0 && eh[0] == 23 && em[0] == 59)
				{
					//$("input#allDay").checkbox("setValue", 1);
					all.length = 1;
				}
				
				// 不能与已存在的规则相同
				var store = $("div#profile_rule_grid").grid("getStore");
				var data = store.data;
				var index = 0;
				var st = sh + ":" + sm;
				var et = eh + ":" + em;
				
				for (index; index < data.length; index++)
				{
					var dt = data[index];
				
					// 状态一致，都是checked/unchecked。
					if ((mon.length == Number(dt.dayVal_mon) + len) && (tue.length == Number(dt.dayVal_tue) + len) &&
						(wed.length == Number(dt.dayVal_wed) + len) && (thu.length == Number(dt.dayVal_thu) + len) &&
						(fri.length == Number(dt.dayVal_fri) + len) && (sat.length == Number(dt.dayVal_sat) + len) &&
						(sun.length == Number(dt.dayVal_sun) + len) && (index != curRuleIdx))
					{
						if (dt.allDay == all.length && all.length == 1)
						{
							$("input#weekDay").radio("setError", $.su.CHAR.SCHEDULER.RULEDUP);
							return false;
						}
						if (dt.allDay == all.length && all.length == 0)
						{
							if (st == dt.tStart && et == dt.tEnd)
							{
								$("input#weekDay").radio("setError", $.su.CHAR.SCHEDULER.RULEDUP);
								return false;
							}
						}
					}
				}
				
				dayEnableAll();
				setTimeSlt(false);

				return true;
			},

	function    HTMLDeCode(str)  
  {  
        var    s    =    "";  
        if    (str.length    ==    0)    return    "";  
        s    =    str.replace(/&amp;/g,    "&");  
        s    =    s.replace(/&lt;/g,        "<");  
        s    =    s.replace(/&gt;/g,        ">");  
        s    =    s.replace(/'/g,      "\'");  
        s    =    s.replace(/&quot;/g,      "\""); 
        s 	 = 	  s.replace(/&nbsp;/g, " "); 
        //s    =    s.replace(/ <br>/g,      "\n"); 
        return    s;  
  }

	function setTimeSlt(isTrue)
	{
		if ($("input#start_hour").combobox("getContainer") &&
			$("input#start_min").combobox("getContainer") &&
			$("input#end_hour").combobox("getContainer") &&
			$("input#end_min").combobox("getContainer"))
		{
			if (isTrue)
			{
				$("input#start_hour").combobox("disable");
				$("input#start_min").combobox("disable");
				$("input#end_hour").combobox("disable");
				$("input#end_min").combobox("disable");
			}
			else
			{
				$("input#start_hour").combobox("enable");
				$("input#start_min").combobox("enable");
				$("input#end_hour").combobox("enable");
				$("input#end_min").combobox("enable");
			}
		}
	}
	
	function dayPickAll()
	{
		$("input#dayVal_mon").checkbox("setValue", "1");
		$("input#dayVal_tue").checkbox("setValue", "1");
		$("input#dayVal_wed").checkbox("setValue", "1");
		$("input#dayVal_thu").checkbox("setValue", "1");
		$("input#dayVal_fri").checkbox("setValue", "1");
		$("input#dayVal_sat").checkbox("setValue", "1");
		$("input#dayVal_sun").checkbox("setValue", "1");
	}

	function dayPickNone()
	{
		$("input#dayVal_mon").checkbox("setValue", "0");
		$("input#dayVal_tue").checkbox("setValue", "0");
		$("input#dayVal_wed").checkbox("setValue", "0");
		$("input#dayVal_thu").checkbox("setValue", "0");
		$("input#dayVal_fri").checkbox("setValue", "0");
		$("input#dayVal_sat").checkbox("setValue", "0");
		$("input#dayVal_sun").checkbox("setValue", "0");
	}
	function dayDisableAll()
	{
		$("input#dayVal_mon").checkbox("disableAll");
		$("input#dayVal_tue").checkbox("disableAll");
		$("input#dayVal_wed").checkbox("disableAll");
		$("input#dayVal_thu").checkbox("disableAll");
		$("input#dayVal_fri").checkbox("disableAll");
		$("input#dayVal_sat").checkbox("disableAll");
		$("input#dayVal_sun").checkbox("disableAll");
	}
	function dayEnableAll()
	{
		$("input#dayVal_mon").checkbox("enableAll");
		$("input#dayVal_tue").checkbox("enableAll");
		$("input#dayVal_wed").checkbox("enableAll");
		$("input#dayVal_thu").checkbox("enableAll");
		$("input#dayVal_fri").checkbox("enableAll");
		$("input#dayVal_sat").checkbox("enableAll");
		$("input#dayVal_sun").checkbox("enableAll");
	}
	// daily
	function selectEveryday()
	{
		/*  自动选中星期一到星期天  */
		dayPickAll();
		/*  设置成禁用  */
		dayDisableAll();
	}
	// weekday
	function selectWeekday()
	{
		dayDisableAll();
		dayPickAll();
		$("input#dayVal_sat").checkbox("setValue", "0");
		$("input#dayVal_sun").checkbox("setValue", "0");
	}
	// weekend
	function selectWeekend()
	{
		dayPickNone();
		dayDisableAll();
		$("input#dayVal_sat").checkbox("setValue", "1");
		$("input#dayVal_sun").checkbox("setValue", "1");	
	}
	// days
	function selectDays()
	{
		dayPickNone();
		dayEnableAll();
	}
