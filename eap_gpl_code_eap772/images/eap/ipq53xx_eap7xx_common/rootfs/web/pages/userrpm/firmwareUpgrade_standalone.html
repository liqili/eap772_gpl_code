		  	 $("#file").file("setError", $.su.CHAR.FIRMWARE.NO_FILE_CHOSEN);

      var fileNameStr = pathStr[pathStr.length-1];

	    if(63 < fileNameStr.length)
	    {
		  	 $("#file").file("setError", $.su.CHAR.FIRMWARE.FILE_NAME_TOO_LONG);
		  	 return false;
		  }

 		  var tmp = filePath.split(".");
		  var ext = tmp[tmp.length-1];
	    if(ext != "bin")
	    {
		  	 return false;
		  }

   		$("#upgrade_alert_cnt").msg("show");
			
		},
		cls:"submit"
	});

	function getCheckResult()
	{
	    var data = {};
	    data = $.extend({
    	      "operation": "update"
        }, data);

		// $("#warning_tip").html($.su.CHAR.FIRMWARE.UPDATING);
		// pro_bar.progressbar("stop");
		// pro_bar.progressbar("reset");
		// $("#pro_cnt").show();
		// $.su.mask.show();

		// pro_bar.progressbar("animate", 0, 1, upgrade_time);

		  $.ajax({
		  	url: UPGRADE_URL,
		  	type: 'GET',
		  	data: data,
		  	dataType: 'json',
		  	cache:false,
		  	error: function(){return false;},
		  	success: function(result){
				if (true == result.timeout)
				{
					window.top.location.href = "/";
				}
		  		if(result.errCode != 0){
		  			$.su.mask.hide();
		  			loopFlag = false;
		  			if(result.errCode == "-1")
				    {
				    	 $("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_FAIL);
				    }
				    else if(result.errCode == "50001")
				    {
				    	$("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_BAD_FILE);
				    }
				    else if(result.errCode == "50002")
				    {
				    	$("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_SAME_VERSION);
				    }
				    else if(result.errCode == "50003")
				    {
				    	$("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_OLD_VERSION);
				    }
				    else
				    {
				      $("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_FAIL);
				    }
	          
	          		$("#pro_cnt").hide();
		  		}else{

					var forceReload = setTimeout(function(){

					  	var protocol = document.location.protocol;

				  		if(protocol.toUpperCase() == 'HTTPS:'){
							pro_bar.progressbar("stop");
					  		pro_bar.progressbar("animate", pro_bar.progressbar("getValue"), 1, 3*60*1000, function(){
					  			location=location;
					  		});
				  		}else{
				  			var ifEnd = setInterval(function(){
								$.ajax({
								  	url: UPGRADE_URL,
								  	type: 'GET',
								  	data: data,
								  	dataType: 'json',
								  	cache: false,
								  	error: function(){
								  		clearTimeout(forceReload);
								  		return false;
								  	},
								  	success: function(result){
								  		if(result.success !=true){
								  			clearTimeout(forceReload);
								  		}
								  		clearInterval(ifEnd);

								  		pro_bar.progressbar("stop");
								  		pro_bar.progressbar("animate", pro_bar.progressbar("getValue"), 1, 3000, function(){
								  			location=location;
								  		});
								  	}
						  		});
							}, 1000);
				  		}
					}, 60*1000);  

		  		}
		  	}
		  });


	}
		
	$("#upgrade_alert_cnt").msg({
		okHandler:function(){
			pro_bar.progressbar("stop");
			pro_bar.progressbar("reset");
			$("#pro_cnt").show();
			$("#warning_tip").html($.su.CHAR.FIRMWARE.UPDATING);
			pro_bar.progressbar("animate", 0, 1, upgrade_time+10*1000);
			setTimeout(function(){
				$.su.mask.show();
			}, 5);	//in case okhandler hide the mask

			var uploadErrorTick = setTimeout(function(){
				pro_bar.progressbar("stop");
				pro_bar.progressbar("reset");
				$("#pro_cnt").hide();
				$.su.mask.hide();
			}, 15*1000);

	        $("#firmware-upgrade").form('submit', null, function(){
	        	clearTimeout(uploadErrorTick);
	          	getCheckResult();
			}, function(){
				clearTimeout(uploadErrorTick);
				$.su.mask.hide();
				$("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_FAIL);
			}, function(){
				clearTimeout(uploadErrorTick);
				$.su.mask.hide();
				$("#warning_tip").html($.su.CHAR.FIRMWARE.CHECK_FAIL);
			});
			
		},
		cancelHandler:function(){
			return true;
		},
		type: "prompt",
		cls:"m"
	});
	
	$("div#upgrade_alert_cnt").css("top", ($(window).height()-$("div#upgrade_alert_cnt").height()-76)/2);
	$("div#upgrade_alert_cnt").css("left", "50%" );

	$("#confirm_content").html($.su.CHAR.FIRMWARE.CONFIRM_CONTENT);
	

	var upgProxy = new $.su.Proxy({
		url: UPGRADE_URL
	});
	
	$("#firmware-upgrade").form({
		proxy: upgProxy,
		formEnctype: "multipart/form-data",
		traditional: true,
		hiddenFrame: true,
		fields: [
		],
		autoLoad:false,
		submitBtn: null
	});

	$("p#upgrade_warn").html("Warning:");  
	$("p#upgrade_note").html($.su.CHAR.FIRMWARE.UPGRADE_NOTE);

});
