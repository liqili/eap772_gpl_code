<script type="text/javascript">
$(document).ready(function(e){

    // var URL_QOS_2G = "./data/qos_setting.2g.json";
    // var URL_QOS_5G = "./data/qos_setting.5g.json";

    var URL_QOS = "./data/qos_setting.json";
    var qosProxy = new $.su.Proxy({url: URL_QOS, timeout: 60000, type: "GET"});

    // var qosProxy_2g = new $.su.Proxy({url: URL_QOS_2G, timeout: 60000, type: "GET"});
    // var qosProxy_5g = new $.su.Proxy({url: URL_QOS_5G, timeout: 60000, type: "GET"});

    var cwItems = [];
    for(var k = 1; k <= 10; k++)
    {
        var tmpItem = {};
        tmpItem.value = ((1<<k)-1);
        tmpItem.name  = ((1<<k)-1);
        cwItems.push(tmpItem);
    }

    var curFreqBand = "2g";
    var freqBand = {"0":"2g", "1":"5g", "2": "5g2", "3":"6g"};
    var wmmAC = {"0":"vo", "1":"vi", "2":"be", "3":"bk"};
    var fb_idx, ac_idx;

    function showTips()
    {
        $("div.warning_tip").slideDown("slow");
    }

    function hideTips()
    {
        $("div.warning_tip").slideUp("slow");
    }

	function tipsIn2G()
	{
		$("div.warning_tip").insertBefore("div#edca_ap_2g");
	}

	function tipsIn5G()
	{
		$("div.warning_tip").insertBefore("div#edca_ap_5g");
    }
    
	function tipsIn5G2()
	{
		$("div.warning_tip").insertBefore("div#edca_ap_5g2");
	}

    String.format = function(src){
        if (arguments.length == 0) return null;
        var args = Array.prototype.slice.call(arguments, 1);
        return src.replace(/\{(\d+)\}/g, function(m, i){
            return args[i];
        });
    };

    function setEdcaState(freqBand, edState)
    {
        for(ac_idx in wmmAC)
        {
            /* AP EDCA */
            var ap_aifs_selector     = String.format("input#ap_{0}_aifs_{1}",     wmmAC[ac_idx], freqBand);
            var ap_cwmin_selector    = String.format("input#ap_{0}_cwmin_{1}",    wmmAC[ac_idx], freqBand);
            var ap_cwmax_selector    = String.format("input#ap_{0}_cwmax_{1}",    wmmAC[ac_idx], freqBand);
            var ap_maxBurst_selector = String.format("input#ap_{0}_maxBurst_{1}", wmmAC[ac_idx], freqBand);

            $(ap_aifs_selector).textbox(edState);
            $(ap_cwmin_selector).combobox(edState);
            $(ap_cwmax_selector).combobox(edState);
            $(ap_maxBurst_selector).textbox(edState);

            /* STATION EDCA */
            var sta_aifs_selector      = String.format("input#sta_{0}_aifs_{1}",      wmmAC[ac_idx], freqBand);
            var sta_cwmin_selector     = String.format("input#sta_{0}_cwmin_{1}",     wmmAC[ac_idx], freqBand);
            var sta_cwmax_selector     = String.format("input#sta_{0}_cwmax_{1}",     wmmAC[ac_idx], freqBand);
            var sta_txopLimit_selector = String.format("input#sta_{0}_txopLimit_{1}", wmmAC[ac_idx], freqBand);

            $(sta_aifs_selector).textbox(edState);
            $(sta_cwmin_selector).combobox(edState);
            $(sta_cwmax_selector).combobox(edState);
            $(sta_txopLimit_selector).textbox(edState);
        }

		var noAck_status_selector = String.format("input#noAck_status_{0}", freqBand);
		var uapsd_status_selector = String.format("input#uapsd_status_{0}", freqBand);
		if ("enable" == edState)
		{
			$(noAck_status_selector).checkbox("enableItem", ["on"]);
			$(uapsd_status_selector).checkbox("enableItem", ["on"]);
		}
		else if("disable" == edState)
		{
			$(noAck_status_selector).checkbox("disableItem", ["on"]);
			$(uapsd_status_selector).checkbox("disableItem", ["on"]);
		}
    }

    function checkQosForm(freqBand)
    {
        var aifs, cwmin, cwmax, maxBurst, txopLimit;
        for(ac_idx in wmmAC)
        {
            /* AP EDCA */
            var ap_aifs_selector     = String.format("input#ap_{0}_aifs_{1}",     wmmAC[ac_idx], freqBand);
            var ap_cwmin_selector    = String.format("input#ap_{0}_cwmin_{1}",    wmmAC[ac_idx], freqBand);
            var ap_cwmax_selector    = String.format("input#ap_{0}_cwmax_{1}",    wmmAC[ac_idx], freqBand);
            var ap_maxBurst_selector = String.format("input#ap_{0}_maxBurst_{1}", wmmAC[ac_idx], freqBand);

            aifs      = parseInt($(ap_aifs_selector).textbox("getValue"));
            cwmin     = parseInt($(ap_cwmin_selector).combobox("getValue"));
            cwmax     = parseInt($(ap_cwmax_selector).combobox("getValue"));
            maxBurst  = parseInt($(ap_maxBurst_selector).textbox("getValue"));

            if (aifs < 0 || aifs > 15)
            {
                //$("span.warning_text").html(String.format($.su.CHAR.QOS_SETTING.EDCA_AIFS_TIP, "AP", ac_idx));
                //$(ap_aifs_selector).textbox("setFocus");
				$(ap_aifs_selector).textbox("setError", "0-15");
                return false;
            }
            if (!((cwmin > 0 && cwmin < 1024) && (cwmax > 0 && cwmax < 1024) && (cwmin <= cwmax)))
            {
                //$("span.warning_text").html(String.format($.su.CHAR.QOS_SETTING.EDCA_CW_TIP, "AP", ac_idx));
                //$(ap_cwmin_selector).combobox("setFocus");
                $(ap_cwmin_selector).combobox("setErrorTips", $.su.CHAR.QOS_SETTING.CONTENTION_WINDOW_ERROR);
                return false;
            }
            if (maxBurst < 0 || maxBurst > 8192 || maxBurst%32 != 0)
            {
                //$("span.warning_text").html(String.format($.su.CHAR.QOS_SETTING.EDCA_MAXBURST_TIP, "AP", ac_idx));
                //$(ap_maxBurst_selector).textbox("setFocus");
				$(ap_maxBurst_selector).textbox("setError", $.su.CHAR.QOS_SETTING.MAXIMUM_BURST_ERROR);
                return false;
            }

            /* STATION EDCA */
            var sta_aifs_selector      = String.format("input#sta_{0}_aifs_{1}",      wmmAC[ac_idx], freqBand);
            var sta_cwmin_selector     = String.format("input#sta_{0}_cwmin_{1}",     wmmAC[ac_idx], freqBand);
            var sta_cwmax_selector     = String.format("input#sta_{0}_cwmax_{1}",     wmmAC[ac_idx], freqBand);
            var sta_txopLimit_selector = String.format("input#sta_{0}_txopLimit_{1}", wmmAC[ac_idx], freqBand);

            aifs      = parseInt($(sta_aifs_selector).textbox("getValue"));
            cwmin     = parseInt($(sta_cwmin_selector).combobox("getValue"));
            cwmax     = parseInt($(sta_cwmax_selector).combobox("getValue"));
            txopLimit = parseInt($(sta_txopLimit_selector).textbox("getValue"));

            if (aifs < 0 || aifs > 15)
            {
                //$("span.warning_text").html(String.format($.su.CHAR.QOS_SETTING.EDCA_AIFS_TIP, "STATION", ac_idx));
                //$(sta_aifs_selector).textbox("setFocus");
				$(sta_aifs_selector).textbox("setError", "0-15");
                return false;
            }
            if (!((cwmin > 0 && cwmin < 1024) && (cwmax > 0 && cwmax < 1024) && (cwmin <= cwmax)))
            {
                //$("span.warning_text").html(String.format($.su.CHAR.QOS_SETTING.EDCA_CW_TIP, "STATION", ac_idx));
                //$(sta_cwmin_selector).combobox("setFocus");
                $(sta_cwmin_selector).combobox("setErrorTips", $.su.CHAR.QOS_SETTING.CONTENTION_WINDOW_ERROR);
                return false;
            }
            if (txopLimit < 0 || txopLimit > 8192 || txopLimit%32 != 0)
            {

            {name: "sta_bk_cwmax",     mapping: "sta_bk_cwmax"},
            {name: "sta_bk_txopLimit", mapping: "sta_bk_txopLimit"},

            {name: "wmm_enable",       mapping: "wmm_enable"},
            {name: "noAck_enable",     mapping: "noAck_enable"},
            {name: "uapsd_enable",     mapping: "uapsd_enable"}
        ],
        autoLoad: false,
        validator: function(){
            if(false == checkQosForm("6g"))
            {
                //showTips();
                return false;
            }

            hideTips();
            return true;
        },
        submitBtn: "default"
    });

	if (0 === $.su.dutMode)		/* single radio */
	{
		$("div#wireless-freq").hide();
	}
	if (1 === $.su.dutMode || 3 === $.su.dutMode)
	{
        $("#show-5g2").hide();
        $("#show-5g").html($.su.CHAR.MODE.MODE_5G);
	}
	if (2 === $.su.dutMode || 4 === $.su.dutMode)
	{
        $("#show-5g2").show();
        $("#show-5g").html($.su.CHAR.MODE.MODE_5G1);
        $("#show-5g2").html($.su.CHAR.MODE.MODE_5G2);
	}
	if (3 === $.su.dutMode || 4 === $.su.dutMode)
	{
        $("#show-6g").show();
	}else{
        $("#show-6g").hide();
    }

});
</script>
</body>

</html>
