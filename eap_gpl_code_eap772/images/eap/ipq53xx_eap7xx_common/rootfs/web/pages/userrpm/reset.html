<script type="text/javascript">
  
//<![CDATA[
	$(document).ready(function(e){
	
	var CONNECT_URL = "./data/rebootState.json";

	var connectProxy = new $.su.Proxy({
		url: CONNECT_URL,
		async: false,
		timeout: 2000,
		type: "GET"
	});

	$("#under-control-title").text($.su.CHAR.LOGIN.UNDER_CONTROL);
	$("#under-control-reset").text($.su.CHAR.LOGIN.RESET_TIPS);
	$("#under-control-alert .text").text($.su.CHAR.LOGIN.ALERT);
	$("#reset_title").text($.su.CHAR.LOGIN.RESETING);
	$("#reset_tips").text($.su.CHAR.LOGIN.RESETING_TIPS);
	$("#under-control-button").button({
        text: $.su.CHAR.LOGIN.RESET_BUTTON,
        handler: function(e){
			$("#under-control-container").hide();
			$("#progress-container").show();
			$("#pro_cnt").fadeIn(200);
			// $('input#pro_bar').progressbar("animate", 0, 1, 80*1000);

			var ip = '';

			$.ajax({
				url: "./data/configReset.json",
				type: 'GET',
				data: {},
				dataType: 'json',
				cache:false,
				error: function(){return false;},
				success: function(result){
					
					if(result.defaultIP != ""){
						ip = result.defaultIP
					}

					/*setTimeout(function(){
						top.location.href = "http://" + ip
					}, 82*1000);*/


			     	var protocol = document.location.protocol;
			     	
			    	if(protocol.toUpperCase() == 'HTTPS:'){	
			    		$('input#pro_bar').progressbar("animate", 0, 1, 3*60*1000, function(){
			    			top.location.href = "http://" + ip;
			});
			    	}else{
			    		$('input#pro_bar').progressbar("animate", 0, 1, 3*60*1000);
			var hasHandled = false;
					setTimeout(function(){
				var checkServer = setInterval(function(){
					connectProxy.read({}, function(){
						if(!hasHandled){
							hasHandled = true;
							clearInterval(checkServer);
							$('input#pro_bar').progressbar("stop");
							$('input#pro_bar').progressbar("animate", $('input#pro_bar').progressbar("getValue"), 1, 5000, function(){
								top.location.href = "http://" + ip;
							});
				}
			});
			}, 10000);
						}, 10000);
			    	}
				}
			});

        },
        cls: "margin-top-30 submit"
    });
	$('input#pro_bar').progressbar({
		fieldLabel: null,
		cls: 'inline',
		width: 388,
		height: 8,
		value: 0
	});
	

});
//]]>
</script>
