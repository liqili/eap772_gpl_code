<script type="text/javascript">
//<![CDATA[
$(document).ready(function(e){
	$("div.func-container").page({
		title: $.su.CHAR.PORTAL.TITLE,
		help: ""	//可能是个调用的id 也可能是个url
	});

	// ----------------------------- portal configuration ---------------------------- //
	var PORTAL_BASIC_URL = new $.su.Proxy({
		url: "./data/portal_basic.json",
		timeout: 120000
	});
	
	var curPolicyIndex = -1;//用来避免添加重复的PolicyName
	var ssidList = [];
	
	$('div#portal_cfg').panel({
		title: $.su.CHAR.PORTAL.TITLE_CFG,
		collapsible: false
	});
	
	/*$("input#username").textbox({
		fieldLabel: $.su.CHAR.PORTAL.USERNAME,
		allowBlank: false,
		//vtype: "string_strict",
		maxLength: 31
	});*/
	
	$("input#password").textbox({
		fieldLabel: $.su.CHAR.PORTAL.PWD,
		allowBlank: false,
		//vtype: "string_strict",
		vtype: "ascii_visible",
		maxLength: 31,
		inputCls: "xl"
	});

	$("input#ssidName").combobox({
		fieldLabel: $.su.CHAR.PORTAL.SSID,
		multiSelect: true,
		inputCls: "xl",
		allowBlank: true
	}).on('ev_change', function(e, oldValue, newValue){
		var comboDiv = $(e.currentTarget).parents('.combobox-container');

		var valueStr = '';
		for(var i=0; i<newValue.length; i++){
			var input = comboDiv.find('input[value='+newValue[i]+']');
			var index = input[0].getAttribute('index');

			if( index!='false' ){
				index = index.replace(/\+/g, ',');
				index += ',';
				valueStr += index;
			}else{
				valueStr += newValue[i] + ',';
			}
		}
		valueStr = valueStr.slice(0, valueStr.length-1);
		$('#ssidNameHidden').val(valueStr);
	});


	$("input#ssidNameHidden").textbox({
		fieldLabel: '',
		cls: 'hidden'
	});

	$.ajax({
		url: './data/portal.ssid.json',
		type: 'GET',
		// data:para,
		async: false,
		dataType: 'json',
		timeout: 10000,
		success: function(result){
			var nameList = [];
			var pureList = [];
			var oriData = result.data;
			ssidList = oriData;
			for(var i=0; i<oriData.length; i++){
				nameList.push( { name:oriData[i].name, value:oriData[i].apId } );
			}

			for(var i=0; i<nameList.length; i++){
				var flag = true;
				for(var m=0; m<pureList.length; m++){
					if( pureList[m].name ==  nameList[i].name){
						if (!pureList[m].index) {
							pureList[m].index = pureList[m].value + '+' + nameList[i].value;
						} else {
							pureList[m].index += '+' + nameList[i].value;
						}
						flag = false;
					}
				}
				flag?pureList.push(nameList[i]):1;
			}

			$("input#ssidName").combobox('loadData', pureList);

			/*if(pureList.length>0){
				$("input#ssidName").combobox('setValue', pureList[0].value);
			}*/
		},
		error: function(xhr, s, et){}
	});
	
	$("input#radiusServerIp").textbox({
		fieldLabel: $.su.CHAR.PORTAL.RADIUS_SERVER_IP,
		allowBlank: false,
		vtype: "ip",
		inputCls: "xl"
	});
	
	$("input#radiusPort").textbox({
		fieldLabel: $.su.CHAR.PORTAL.RADIUS_PORT,
		allowBlank: false,
		vtype: "number",
		tips: "(1-65535)",
		invalidText:$.su.CHAR.PORTAL.ERR_PORT,
		validator:function(val){
			if((val >= 1) && (val <= 65535))
			{
				return true;
			}
			else
			{
				return false;
			}
		},
		inputCls: "xl"
	});
	
	$("input#radiusPwd").textbox({
		fieldLabel: $.su.CHAR.PORTAL.RADIUS_PWD,
		allowBlank: false,
		//vtype: "string_strict",
		vtype: "ascii_visible",
		maxLength: 128,
		inputCls: "xl"
	});
	
	function handleServerType(newValue)
	{
		if ("0" == newValue[0])
		{
			$("div#portal_localPage").css({
					"display": "inline-block"
				});
				
			$("textarea#portal_title").textarea("enable");
			$("textarea#portal_useTerm").textarea("enable");				
				
			$("input#rmtPortalUrl").textbox("hide");
			$("input#rmtPortalUrl").textbox("disable");
		}
		else
		{
			$("div#portal_localPage").css({
					"display": "none"
				});
				
			$("textarea#portal_title").textarea("disable");
			$("textarea#portal_useTerm").textarea("disable");
				
			$("input#rmtPortalUrl").textbox("show");
			$("input#rmtPortalUrl").textbox("enable");
		}
	}
	
	function handleAuthType(newValue)
	{
		if ('0' == newValue[0])
		{
		    $("input#portal_usernameShow").textbox("hide");
			$("input#portal_pwdShow").textbox("hide");
			
			$("input#serverType").combobox("loadData", [{name: $.su.CHAR.PORTAL.LOCAL_PORTAL,  value: '0', selected:true}]);
		}
		else
		{			
			$("input#portal_usernameShow").textbox("show");
			$("input#portal_pwdShow").textbox("show");
			if ('1' == newValue[0])
			{
				$("input#portal_usernameShow").textbox("hide");
			}
		}
		
		if ('1' == newValue[0])
		{
		    $("input#username").textbox("show");
			$("input#username").textbox("enable");
			$("input#password").textbox("show");
			$("input#password").textbox("enable");
			
			$("input#serverType").combobox("loadData", [{name: $.su.CHAR.PORTAL.LOCAL_PORTAL,  value: '0', selected:true}]);
		}
		else
		{
			$("input#username").textbox("hide");
			$("input#username").textbox("disable");
			$("input#password").textbox("hide");
			$("input#password").textbox("disable");
		}
		
		if ('2' == newValue[0])
		{
			$("input#radiusServerIp").textbox("show");
			$("input#radiusServerIp").textbox("enable");
			$("input#radiusPort").textbox("show");
			$("input#radiusPort").textbox("enable");
			$("input#radiusPwd").textbox("show");
			$("input#radiusPwd").textbox("enable");

			$("input#nasId").textbox("show");
            $("input#nasId").textbox("enable");

            $("input#radiusAccounting").checkbox("show");

            if ($("input#radiusAccounting").checkbox("getValue") == "radiusAccounting") {
                $("input#acctRadiusIp").textbox("show");
                $("input#acctRadiusIp").textbox("enable");
                $("input#acctRadiusPort").textbox("show");
                $("input#acctRadiusPort").textbox("enable");
                $("input#acctRadiusPwd").textbox("show");
                $("input#acctRadiusPwd").textbox("enable");
                $("input#interimUpdate").checkbox("show");
                $("input#interimInterval").textbox("show");
				if($("input#interimUpdate").checkbox("getValue") == "interimUpdate") {
					$("input#interimInterval").textbox("enable");
				}
			}

			$("input#serverType").combobox("loadData", [{name: $.su.CHAR.PORTAL.LOCAL_PORTAL,  value: '0', selected:true}, {name: $.su.CHAR.PORTAL.EXTERNAL_PORTAL,  value: '1'}]);
		}
		else
		{
			$("input#radiusServerIp").textbox("hide");
			$("input#radiusServerIp").textbox("disable");
			$("input#radiusPort").textbox("hide");
			$("input#radiusPort").textbox("disable");
			$("input#radiusPwd").textbox("hide");
			$("input#radiusPwd").textbox("disable");

            $("input#nasId").textbox("hide");
            $("input#nasId").textbox("disable");

            $("input#radiusAccounting").checkbox("hide");

            $("input#acctRadiusIp").textbox("hide");
            $("input#acctRadiusIp").textbox("disable");
            $("input#acctRadiusPort").textbox("hide");
            $("input#acctRadiusPort").textbox("disable");
            $("input#acctRadiusPwd").textbox("hide");
            $("input#acctRadiusPwd").textbox("disable");
            $("input#interimUpdate").checkbox("hide");
            $("input#interimInterval").textbox("hide");
            $("input#interimInterval").textbox("disable");
		}
		
		handleServerType($("input#serverType").combobox('getValue'));
	}
	
	$("input#authType").combobox({
		fieldLabel: $.su.CHAR.PORTAL.AUTH_TYPE,
		//cls: 'inline',
		inputCls: "xl",
		items:[
			{name: $.su.CHAR.PORTAL.NO_AUTHENTICATION, value: '0'},
			{name: $.su.CHAR.PORTAL.LOCAL_PASSWORD, value: '1', selected:true},
			{name: $.su.CHAR.PORTAL.EXTERNAL_SERVER, value: '2'}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		handleAuthType(newValue);
	});


    $("input#nasId").textbox({
        fieldLabel: $.su.CHAR.PORTAL.NAS_ID,
        allowBlank: true,
        //vtype: "ascii_visible",
        maxLength: 64,
        inputCls: "xl",
        invalidText:$.su.CHAR.VTYPETEXT.STRING_VISIBLE,
        validator:function(val){
            if(!$.su.vtype.types.ascii_visible.regex.test(val))
            {
                $("#nasId").textbox("setError", $.su.CHAR.VTYPETEXT.STRING_VISIBLE);
                return false;
            }
            else
            {
                return true;
            }
        }
    });

    $("input#radiusAccounting").checkbox({
        fieldLabel: $.su.CHAR.PORTAL.RADIUS_ACCOUNTING,
        inputCls: "xl",
        items: [
            {boxlabel: $.su.CHAR.PORTAL.ENABLE, inputValue: "true", uncheckedValue: "false", checked:false}
        ]
    }).on("ev_change", function(e, oldVal, newVal){
        if ($("input#authType").combobox("getValue") == "2") {
            if (newVal.length==0 || newVal[0] =='false' || newVal[0] ==false || newVal[0] ==0)
            {
                $("input#acctRadiusIp").textbox("disable");
                $("input#acctRadiusIp").textbox("hide");
                $("input#acctRadiusPort").textbox("hide");
                $("input#acctRadiusPort").textbox("disable");
                $("input#acctRadiusPwd").textbox("hide");
                $("input#acctRadiusPwd").textbox("disable");
                $("input#interimUpdate").checkbox("hide");
                $("input#interimInterval").textbox("hide");
                $("input#interimInterval").textbox("disable");
            }
            else
            {
                $("input#acctRadiusIp").textbox("show");
                $("input#acctRadiusIp").textbox("enable");
                $("input#acctRadiusPort").textbox("show");
                $("input#acctRadiusPort").textbox("enable");
                $("input#acctRadiusPwd").textbox("show");
                $("input#acctRadiusPwd").textbox("enable");
                $("input#interimUpdate").checkbox("show");
                $("input#interimInterval").textbox("show");
				if($("input#interimUpdate").checkbox("getValue") == "interimUpdate") {
					$("input#interimInterval").textbox("enable");
				}
            }
		}
    });

    $("input#acctRadiusIp").textbox({
        fieldLabel: $.su.CHAR.PORTAL.ACCOUNT_SERVER_IP,
        allowBlank: false,
        vtype: "ip",
        inputCls: "xl"
    });

    $("input#acctRadiusPort").textbox({
        fieldLabel: $.su.CHAR.PORTAL.ACCOUNT_SERVER_PORT,
        allowBlank: false,
        vtype: "number",
        tips: "(1-65535)",
        invalidText:$.su.CHAR.PORTAL.ERR_PORT,
        validator:function(val){
            if((val >= 1) && (val <= 65535))
            {
                return true;
            }
            else
            {
                return false;
            }
        },
        inputCls: "xl"
    });

    $("input#acctRadiusPwd").textbox({
        fieldLabel: $.su.CHAR.PORTAL.ACCOUNT_SERVER_PWD,
        allowBlank: false,
        vtype: "ascii_visible",
        maxLength: 128,
        inputCls: "xl"
    });

    $("input#interimUpdate").checkbox({
        fieldLabel: $.su.CHAR.PORTAL.INTERIM_UPDATE,
        inputCls: "xl",
        items: [
            {boxlabel: $.su.CHAR.PORTAL.ENABLE, inputValue: "true", uncheckedValue: "false", checked:false}
        ]
    }).on("ev_change", function(e, oldVal, newVal){
		if (newVal.length==0 || newVal[0] =='false' || newVal[0] ==false || newVal[0] ==0)
        {
            //$("input#interimInterval").textbox("hide");
            $("input#interimInterval").textbox("disable");
        }
        else
        {
            //$("input#interimInterval").textbox("show");
            $("input#interimInterval").textbox("enable");
			if($("input#interimInterval").textbox("getValue") == ""
				|| $("input#interimInterval").textbox("getValue") == null
				|| $("input#interimInterval").textbox("getValue") == undefined)
			{
				$("input#interimInterval").textbox("setValue", 600);
			}
        }
    });

    $("input#interimInterval").textbox({
        fieldLabel: $.su.CHAR.PORTAL.INTERIM_INTERVAL,
        allowBlank: false,
        vtype: "number",
        invalidText:$.su.CHAR.PORTAL.ERR_INTERVAL,
        tips: $.su.CHAR.PORTAL.INTERIM_INTERVAL_TIP,
        validator:function(val){
            if((val >= 60) && (val <= 86400))
            {
                return true;
            }
            else
            {
                return false;
            }
        },
        inputCls: "xl"
    });

	$("input#portal_day").textbox({
		fieldLabel: null,
		cls: 'inline-block',
		allowBlank: false,
		vtype: "number",
		invalidText:$.su.CHAR.PORTAL.ERR_DAY,
		validator:function(val){
			if((val >= 0) && (val <= 29))
			{
				return true;
			}
			else
			{
				return false;
			}
		}		
	});
	
	$("span#t_portal_day").html($.su.CHAR.PORTAL.DAY);
	
	$("input#portal_hour").textbox({
		fieldLabel: null,
		cls: 'inline-block',
		allowBlank: false,
		vtype: "number",
		invalidText:$.su.CHAR.PORTAL.ERR_HOUR,
		validator:function(val){
			if((val >= 0) && (val <= 23))
			{
				return true;
			}
			else
			{
				return false;
			}
		}
	});
	
	$("span#t_portal_hour").html($.su.CHAR.PORTAL.HOUR);

	$("input#portal_min").textbox({
		fieldLabel: null,
		cls: 'inline-block',
		allowBlank: false,
		vtype: "number",
		invalidText:$.su.CHAR.PORTAL.ERR_MIN,
		validator:function(val){
			if((val >= 0) && (val <= 59))
			{
				return true;
			}
			else
			{
				return false;
			}
		}
	});
	
	$("span#t_portal_min").html($.su.CHAR.PORTAL.MIN);
	
	function handleAuthTimeout(newValue)
	{
		if ("4" == newValue[0])
		{
			$("input#portal_day").textbox("enable");
			$("input#portal_hour").textbox("enable");
			$("input#portal_min").textbox("enable");
		}
		else
		{
			$("input#portal_day").textbox("setNormal");
			$("input#portal_hour").textbox("setNormal");
			$("input#portal_min").textbox("setNormal");
			$("input#portal_day").textbox("disable");
			$("input#portal_hour").textbox("disable");
			$("input#portal_min").textbox("disable");
		}
	}
	
	$("input#authTimeout").combobox({
		fieldLabel: $.su.CHAR.PORTAL.AUTH_TIMEOUT,
		//cls: 'inline',
		inputCls: "xl",
		items:[
			{name: $.su.CHAR.PORTAL.HOUR_1,  value: '0'},
			{name: $.su.CHAR.PORTAL.HOUR_8,  value: '1', selected:true},
			{name: $.su.CHAR.PORTAL.HOUR_24, value: '2'},
			{name: $.su.CHAR.PORTAL.DAY_7,   value: '3'},
			{name: $.su.CHAR.PORTAL.CUSTOM,   value: '4'}
		]
	}).on("ev_change", function(e, oldValue, newValue){
		handleAuthTimeout(newValue);
	});
	
	$("input#redir").checkbox({
		fieldLabel: $.su.CHAR.PORTAL.REDIR,
		inputCls: "xl",
		items: [
			{boxlabel: $.su.CHAR.PORTAL.ENABLE, inputValue: "true", uncheckedValue: "false", checked:false}
		]
	}).on("ev_change", function(){
		if ("redir" == $("input#redir").checkbox("getValue"))
		{
			$("input#redirUrl").textbox("enable");
		}
		else
		{
			$("input#redirUrl").textbox("disable");
			$("input#redirUrl").textbox("setNormal");
		}
	});
	
	$("input#redirUrl").textbox({
		fieldLabel: $.su.CHAR.PORTAL.REDIR_URL,
		invalidText:$.su.CHAR.PORTAL.ERR_URL,
		allowBlank: false,
		inputCls: "xl",
		validator: function(val){
			var url = "";
			
			var is_http_header = val.slice(0,7);
			if ("HTTP://" == is_http_header.toUpperCase())
			{
				url = val.slice(7);
			}
			else
			{
				var is_https_header = val.slice(0,8);
				if ("HTTPS://" == is_https_header.toUpperCase())
				{
					url = val.slice(8);
				}
			}
			
			if ("" != url)
			{
				if ("0.0.0.0" == url.slice(0,7) || "255.255.255.255" == url.slice(0,15))
				{
					return false;
				}
			}
			else
			{
				return false;
			}
			
			var patternDomain = /^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,18}$/
          	var patternIp = /^(\d{1,2}|1\d\d|2[0-4]\d|25[0-5]|0\d\d)(\.(\d{1,2}|1\d\d|2[0-4]\d|25[0-5]|0\d\d)){3}$/

			var ret = patternIp.test(url) || patternDomain.test(url)
			if (ret)
			{
				return true;
			}
			else
			{
				return false;
			}
		}
	});
	
	$("input#rmtPortalUrl").textbox({
		fieldLabel: $.su.CHAR.PORTAL.RMT_PORTAL_URL,
		invalidText:$.su.CHAR.PORTAL.ERR_URL,
		allowBlank: false,
		inputCls: "xl",
		validator: function(val){
			var url = "";
			
			var is_http_header = val.slice(0,7);
			if ("HTTP://" == is_http_header.toUpperCase())
			{
				url = val.slice(7);
			}
			else
			{
				var is_https_header = val.slice(0,8);
				if ("HTTPS://" == is_https_header.toUpperCase())
				{
					url = val.slice(8);
				}
			}
			
			if ("" != url)
			{
				if ("0.0.0.0" == url.slice(0,7) || "255.255.255.255" == url.slice(0,15))
				{
					return false;
				}
			}
			else
			{
				return false;

			/*var reg = /^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])(\.(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])){3}|([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,6})$/;*/
			var reg = /^(((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])(\.(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])){3}|([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,6})(:([1-9]\d{0,3}|[1-5]\d{4}|6[0-4]\d{3}|65[0-4]\d{2}|655[0-2]\d|6553[0-5]))?(\/?[0-9a-zA-Z\/\_\!\~\*\'\(\)\.\;\?\:\@\&\=\+\$\,\%\#\-]{1,200})?)$/;

			var ret = reg.test(url);
			if (ret)
			{
				return true;
			}
			else
			{
				return false;
			}
		}

	var o = $("div#portal_accessCtrl_grid").grid({
		store:{
			proxy: PORTAL_ACCESS_CTRL_URL,
			fields: [
				{name: "key"},
				{name: "portal_policyName"},
				{name: "portal_sIp"},
				{name: "portal_sMask"},
				{name: "portal_dIp"},
				{name: "portal_dMask"},
				{name: "portal_sMac"},
				{name: "portal_port"},
				{name: "portal_status"}
			],
			keyProperty: "key",
			updateMode: "complete",
			autoLoad: true
		},
		minLines: 0,
		editor: {
			content: "#portal_accessCtrl_editor",
			validator:function(){
				var value = $("input#portal_policyName").textbox("getValue");
				// 重复性检查
				var store = $('div#portal_accessCtrl_grid').grid("getStore");
				var data = store.data;
				var index = 0;
				var num = data.length;
				var idx = curPolicyIndex;
				
				for (index = 0; index < num; index++)
				{
					if (value == data[index].portal_policyName && index != idx)
					{
						$("input#portal_policyName").textbox("setError", $.su.CHAR.PORTAL.POLICY_NAME_EXIST);
						return false;
					}
				}

				var portal_sIp = $("input#portal_sIp").textbox("getValue");
				var portal_sMask = $("input#portal_sMask").textbox("getValue");
				if (portal_sIp.replace(/(^s*)|(s*$)/g,"").length != 0 )
				{
					if (portal_sMask.replace(/(^s*)|(s*$)/g,"").length == 0)
					{
						$("input#portal_sMask").textbox("setError", $.su.CHAR.PORTAL.SOURCE_IP_MASK_EMPTY);
						return false;
					}
					if ((!typeof(portal_sMask === 'string')) || parseInt(portal_sMask) < 0 || 32 < parseInt(portal_sMask))
					{
						$("input#portal_sMask").textbox("setError", $.su.CHAR.PORTAL.SOURCE_IP_MASK_ERROR);
						return false;
					}
				}

				var portal_dIp = $("input#portal_dIp").textbox("getValue");
				var portal_dMask = $("input#portal_dMask").textbox("getValue");
				if (portal_dIp.replace(/(^s*)|(s*$)/g,"").length != 0 )
				{
					if (portal_dMask.replace(/(^s*)|(s*$)/g,"").length == 0)
					{
						$("input#portal_dMask").textbox("setError", $.su.CHAR.PORTAL.DESTINATION_IP_MASK_EMPTY);
						return false;
					}
					if (  (!typeof(portal_dMask === 'string')) || parseInt(portal_dMask) < 0  || 32 <parseInt(portal_dMask))
					{
						$("input#portal_dMask").textbox("setError", $.su.CHAR.PORTAL.DESTINATION_IP_MASK_ERROR);
						return false;
					}
				}

				curPolicyIndex = -1;
				return true;
			},
			fields: [
				{name: "portal_policyName"},
				{name: "portal_sIp"},
				{name: "portal_sMask"},
				{name: "portal_dIp"},
				{name: "portal_dMask"},
				{name: "portal_sMac"},
				{name: "portal_port"},
				{name: "portal_status"}
			]
		},
		paging: {
		},
		columns: [
			{
				text: $.su.CHAR.PORTAL.ACCESS_CTRL_ID, 
				width:40,
				xtype: "rownumberer"
			},
			{
				text: $.su.CHAR.PORTAL.ACCESS_CTRL_POLICY_NAME, 
				width:200,
				dataIndex: "portal_policyName"			
			},
			{

					}
					else

				}

					}
				}
