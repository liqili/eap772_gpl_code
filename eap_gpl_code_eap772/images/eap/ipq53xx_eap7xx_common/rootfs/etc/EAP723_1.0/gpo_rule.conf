/*
 * proc_name
 * ====================================================
 * created by gpio.conf
 *
 * mode
 * ====================================================
 * off / on / blink / repeat / stop / enable / disable / ant
 * 
 * flag (bit)
 * ====================================================
 * 0x1: led action will ignore disable and enable
 * 0x2: backup led before the action execute
 * 0x4: ...... 
 *
 * delay_on/delay_off
 * ====================================================
 * unit: ms
 *
 * blink_count
 * ====================================================
 * original off: 1:on;  2:on-off; 3:on-off-on.
 * original on:  1:off; 2:off-on; 3:off-on-off.
 */

{
    "LED_RESET":
    [
        {"proc_name":"led_blue", "param":{"mode":"off",   "flag":1}},
        {"proc_name":"led_blue", "param":{"mode":"blink", "flag":3, "start":200, "delay_on":200,  "delay_off":200,  "blink_count":10}}
    ],
    "LED_UPDATE_START":
    [
        {"proc_name":"led_blue",  "param":{"mode":"off",   "flag":1}},
        {"proc_name":"led_blue", "param":{"mode":"repeat", "flag":1, "start":500,   "delay_on":500, "delay_off":500}}
    ],
    "LED_UPDATE_FINISH":
    [
        {"proc_name":"led_blue",  "param":{"mode":"off", "flag":1}}
    ],
    "LED_DUT_NO_CALDATA":
    [
        {"proc_name":"led_blue", "param":{"mode":"repeat", "flag":4, "delay_on":200, "delay_off":200}}
    ],
    "LED_SYS_INIT_PROCESS":
    [
        {"proc_name":"led_blue",  "param":{"mode":"on"}}
    ],
    "LED_SYS_INIT_OK":
    [
        {"proc_name":"led_blue",  "param":{"mode":"blink", "delay_on":500,  "delay_off":500,  "blink_count":4}}
    ],
    "LED_DISABLE_ALL":
    [
        {"proc_name":"led_blue",  "param":{"mode":"disable", "flag":2}}
    ],
    "LED_ENABLE_ALL":
    [
        {"proc_name":"led_blue",  "param":{"mode":"enable"}}
    ],
    "LED_LOCATE":
    [
        {"proc_name":"led_blue", "param":{"mode":"blink", "flag":19, "delay_on":200,  "delay_off":200,  "blink_count":3000}}
    ],
    "LED_LOCATE_STOP":
    [
        {"proc_name":"led_blue", "param":{"mode":"stop", "flag":1}}
    ],
    "LED_ISOLATED_START":
    [
        {"proc_name":"led_blue", "param":{"mode":"repeat", "flag":2, "delay_on":4200, "delay_off":800}}
    ],
    "LED_ISOLATED_FINISH":
    [
        {"proc_name":"led_blue", "param":{"mode":"stop"}}
    ],
    "LED_RESET_BLUE":
    [
        {"proc_name":"led_blue", "param":{"mode":"off",   "flag":1}},
        {"proc_name":"led_blue", "param":{"mode":"blink", "flag":3, "start":200, "delay_on":200,  "delay_off":200,  "blink_count":10}}
    ],
    "LED_UPDATE_START_BLUE":
    [
        {"proc_name":"led_blue",  "param":{"mode":"off",   "flag":1}},
        {"proc_name":"led_blue", "param":{"mode":"repeat", "flag":1, "start":500,   "delay_on":500, "delay_off":500}}
    ],
    "LED_UPDATE_FINISH_BLUE":
    [
        {"proc_name":"led_blue",  "param":{"mode":"off", "flag":1}}
    ],
    "LED_DUT_NO_CALDATA_BLUE":
    [
        {"proc_name":"led_blue", "param":{"mode":"repeat", "flag":4, "delay_on":200, "delay_off":200}}
    ],
    "LED_SYS_INIT_PROCESS_BLUE":
    [
        {"proc_name":"led_blue",  "param":{"mode":"on"}}
    ],
    "LED_SYS_INIT_OK_BLUE":
    [
        {"proc_name":"led_blue",  "param":{"mode":"blink", "delay_on":500,  "delay_off":500,  "blink_count":4}}
    ],
    "LED_DISABLE_ALL_BLUE":
    [
        {"proc_name":"led_blue",  "param":{"mode":"disable", "flag":2}}
