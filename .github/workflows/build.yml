name: Ubuntu Build, Install, and Upload Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Maximize build disk space
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # Step 2: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 3: Install dependencies
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update && sudo apt-get -qq upgrade
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean

      # Step 4: Ensure /bin/sh points to bash
      - name: Switch /bin/sh to bash
        run: |
          sudo ln -sf /bin/bash /bin/sh
          echo "Switched /bin/sh to bash"

      # Step 5: Prepare toolchain
      - name: Prepare toolchain
        run: |
          cd eap_gpl_code_eap772/build
          make BOARD_TYPE=ipq53xx_eap7xx_common PID=eap WEB_PAGES_ID=VI_2.0 eap_prep

      # Step 6: Perform the actual build
      - name: Build project
        run: |
          cd eap_gpl_code_eap772/build
          make BOARD_TYPE=ipq53xx_eap7xx_common PID=eap WEB_PAGES_ID=VI_2.0 eap_release

      # Step 7: Upload binary files as artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-files
          path: eap_gpl_code_eap772/images/eap/ipq53xx_eap7xx_common/*.bin
